      setElegido(indice) {
        const vivos = tambores.filter((tb) => tb.raiz.visible);
        vivos.forEach((tb, i) => {
          tb.objetivoLuz = i === indice ? 1 : 0;
          tb.objetivoApagado = indice !== null && i !== indice ? 1 : 0;
        });
      },
      esconder() { grupo.visible = false; },
      update(t, dt) {
        const k = Math.min(1, dt * 9);
        tambores.forEach((tb) => {
          if (tb.duracion > 0) {
            const avance = Math.min(1, (t - tb.inicio) / tb.duracion);
            tb.p = tb.desde + (tb.hasta - tb.desde) * CURVA_CARRETE(avance);
            if (avance >= 1) { tb.duracion = 0; tb.p = tb.hasta; }
          }
          tb.cilindro.rotation.y = anguloDe(tb.p);
          const u = tb.material.uniforms;
          u.uElegido.value += (tb.objetivoLuz - u.uElegido.value) * k;
          u.uApagado.value += (tb.objetivoApagado - u.uApagado.value) * k;
          tb.luz.material.opacity = u.uElegido.value * 0.55;
        });
      },
    };
  }

  /* ── crearConteo ───────────────────────────────────────────────────
     Frontera R3F: <Conteo numero /> — aro, cruces y el número, más el haz
     del proyector con el polvo en suspensión que cruza el telón. */
  function crearConteo(grupo) {
    /* El conteo vive DETRÁS del telón, como en la hoja de estilo de la casa
       (`.conteo` z-index 5, `.telon` z-index 6): el velo cubre los carretes,
       los paños pasan por delante del número mientras abren y la cenefa
       nunca se oscurece. Por eso el velo, el aro, las cruces y el número
       prueban profundidad —están en z 1.00–1.04, delante del fondo y de los
       tambores y detrás de los paños (z 1.60) y de la cenefa (z 1.90)—, y
       siguen sin escribirla para no taparse entre ellos. */
    const velo = new THREE.Mesh(
      new THREE.PlaneGeometry(9, 9),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(0.02, 0.008, 0.016), transparent: true, opacity: 0.92,
        depthTest: true, depthWrite: false,
      }),
    );
    velo.position.z = 1.0;
    const aro = new THREE.Mesh(
      new THREE.TorusGeometry(0.745, 0.006, 6, 96),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(0.95, 0.9, 0.78), transparent: true, opacity: 0.35,
        depthTest: true, depthWrite: false,
      }),
    );
    aro.position.z = 1.02;
    const matCruz = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0.95, 0.9, 0.78), transparent: true, opacity: 0.22,
      depthTest: true, depthWrite: false,
    });
    const cruzH = new THREE.Mesh(new THREE.PlaneGeometry(8, 0.011), matCruz);
    const cruzV = new THREE.Mesh(new THREE.PlaneGeometry(0.011, 8), matCruz);
    cruzH.position.z = cruzV.position.z = 1.02;

    const numero = new THREE.Mesh(
      new THREE.PlaneGeometry(1.52, 1.52),
      new THREE.MeshBasicMaterial({
        transparent: true, depthWrite: false, depthTest: true, opacity: 0,
      }),
    );
    numero.position.z = 1.04;

    /* El orden de dibujo entre ellos se conserva (velo, aro, cruces, número)
       y sigue por encima del haz, que es aditivo y arranca en renderOrder 0:
       el haz cruza el telón como la luz de una cabina de verdad. */
    const caja = new THREE.Group();
    caja.add(velo, aro, cruzH, cruzV, numero);
    caja.renderOrder = 20;
    [velo, aro, cruzH, cruzV, numero].forEach((m, i) => { m.renderOrder = 20 + i; });
    caja.visible = false;
    grupo.add(caja);

    /* Haz del proyector: cono abierto y aditivo, así que atraviesa el telón
       mientras abre, igual que la luz de una cabina de verdad. */
    const haz = new THREE.Mesh(
      new THREE.CylinderGeometry(0.09, 2.0, 8.2, 28, 1, true),
      new THREE.ShaderMaterial({
        uniforms: { uColor: { value: CREMA }, uIntensidad: { value: 0 } },
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uIntensidad;
          varying vec2 vUv;
          void main() {
            float largo = smoothstep(0.0, 0.35, vUv.y) * (1.0 - smoothstep(0.55, 1.0, vUv.y));
            float borde = 0.35 + 0.65 * pow(abs(sin(vUv.x * 3.14159)), 0.5);
            gl_FragColor = vec4(uColor * uIntensidad * largo * borde * 0.22, 1.0);
          }`,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        depthTest: false,
        side: THREE.DoubleSide,
      }),
    );
    haz.rotation.x = Math.PI / 2;
    haz.position.z = 2.4;
    haz.visible = false;
    grupo.add(haz);

    /* Polvo en suspensión dentro del haz. */
    const CUANTOS = 340;
    const pos = new Float32Array(CUANTOS * 3);
    const semillas = new Float32Array(CUANTOS);
    for (let i = 0; i < CUANTOS; i += 1) {
      const z = -1.4 + Math.random() * 7.6;
      const r = (0.09 + (6.2 - z) * 0.24) * Math.sqrt(Math.random());
      const a = Math.random() * Math.PI * 2;
      pos[i * 3] = Math.cos(a) * r;
      pos[i * 3 + 1] = Math.sin(a) * r;
      pos[i * 3 + 2] = z;
      semillas[i] = Math.random() * 6.28;
    }
    const geoPolvo = new THREE.BufferGeometry();
    geoPolvo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const polvo = new THREE.Points(geoPolvo, new THREE.PointsMaterial({
      map: TEX_POLVO, size: 0.055, sizeAttenuation: true,
      transparent: true, opacity: 0, depthWrite: false, depthTest: false,
      blending: THREE.AdditiveBlending,
    }));
    polvo.visible = false;
    grupo.add(polvo);

    /* El número se centra por su tinta, no por su caja: `ajusteOpticoDelNumero`
       corrige lo que la métrica declarada de Copperplate miente. */
    const cachéNumero = new Map();
    function texturaNumero(n) {
      if (cachéNumero.has(n)) return cachéNumero.get(n);
      const lado = 256, tam = 150;
      const c = document.createElement('canvas');
      c.width = c.height = lado;
      const x = c.getContext('2d');
      x.font = `400 ${tam}px ${PILA_DISPLAY}`;
      x.textAlign = 'center';
      x.textBaseline = 'alphabetic';
      const m = x.measureText(String(n));
      const subeCaja = m.fontBoundingBoxAscent || tam * 0.8;
      const bajaCaja = m.fontBoundingBoxDescent || tam * 0.2;
      const lineaBase = (lado + subeCaja - bajaCaja) / 2;
      const ajuste = ajusteOpticoDelNumero({
        alto: lado,
        lineaBase,
        tintaArriba: m.actualBoundingBoxAscent,
        tintaAbajo: m.actualBoundingBoxDescent,
      });
      x.fillStyle = '#f2e5c6';
      x.fillText(String(n), lado / 2, lineaBase + ajuste);
      const t = texturaDe(c);
      cachéNumero.set(n, t);
      return t;
    }

    let entrada = 0, mostrando = null, intensidad = 0;
    return {
      grupo,
      setNumero(n) {
        if (n === null) { mostrando = null; caja.visible = false; return; }
        mostrando = n;
        caja.visible = true;
        numero.material.map = texturaNumero(n);
        numero.material.needsUpdate = true;
        entrada = 0;
      },
      setHaz(encendido) { intensidad = encendido ? 1 : 0; },
      update(t, dt) {
        const u = haz.material.uniforms;
        u.uIntensidad.value += (intensidad - u.uIntensidad.value) * Math.min(1, dt * 3.2);
        const viva = u.uIntensidad.value > 0.01;
        haz.visible = polvo.visible = viva;
        polvo.material.opacity = u.uIntensidad.value * 0.55;
        if (viva) {
          const p = geoPolvo.attributes.position;
          for (let i = 0; i < CUANTOS; i += 1) {
            p.array[i * 3 + 1] -= dt * 0.045;
            p.array[i * 3] += Math.sin(t * 0.5 + semillas[i]) * dt * 0.02;
            if (p.array[i * 3 + 1] < -1.6) p.array[i * 3 + 1] = 1.6;
          }
          p.needsUpdate = true;
        }
        if (mostrando !== null) {
          entrada = Math.min(1, entrada + dt / 0.55);
          const e = 1 - Math.pow(1 - entrada, 3);
          numero.scale.setScalar(1.6 - 0.6 * e);   // el pulso 1.6 → 1
          numero.material.opacity = e;
        }
      },
    };
  }

  /* ── crearGanador ──────────────────────────────────────────────────
     Frontera R3F: <Ganador titulo desde vetada /> — el póster sale del
     tambor, vuela hacia la cámara con la luz detrás y se enmarca en un
     octágono de latón. El sello «Vetada» también es geometría. */
  function crearGanador(grupo) {
    const ANCHO = 1.86, ALTO = 2.79, CANTO = 0.13;

    function octagono(w, h, corte) {
      const s = new THREE.Shape();
      s.moveTo(-w / 2 + corte, -h / 2);
      s.lineTo(w / 2 - corte, -h / 2);
      s.lineTo(w / 2, -h / 2 + corte);
      s.lineTo(w / 2, h / 2 - corte);
      s.lineTo(w / 2 - corte, h / 2);
      s.lineTo(-w / 2 + corte, h / 2);
      s.lineTo(-w / 2, h / 2 - corte);
      s.lineTo(-w / 2, -h / 2 + corte);
      s.closePath();
      return s;
    }

    const forma = octagono(ANCHO + CANTO * 2, ALTO + CANTO * 2, 0.30);
    const hueco = octagono(ANCHO - 0.02, ALTO - 0.02, 0.26);
    forma.holes.push(new THREE.Path(hueco.getPoints(64).reverse()));
    const geoMarco = new THREE.ExtrudeGeometry(forma, {
      depth: 0.09, bevelEnabled: true, bevelThickness: 0.022,
      bevelSize: 0.022, bevelSegments: 2, curveSegments: 2,
    });
    geoMarco.computeVertexNormals();

    /* Latón sin luces en la escena: anisotropía falsa por la altura, un
       especular de banda y un filo que recoge la luz del proyector. La luz
       vive en espacio de vista (fija respecto a la cámara), así que al ladear
       el marco el brillo corre por el bisel y por el filo: es lo que hace
       legible el gesto. Dos lóbulos —uno estrecho y fuerte para el destello
       que viaja, otro ancho y tenue para que el metal no se apague. */
    const marco = new THREE.Mesh(geoMarco, new THREE.ShaderMaterial({
      uniforms: { uLaton: { value: LATON }, uTenue: { value: LATON_TENUE }, uCrema: { value: CREMA } },
      vertexShader: `
        varying vec3 vN; varying vec3 vP; varying vec3 vLocal;
        void main() {
          vN = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vP = mv.xyz; vLocal = position;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform vec3 uLaton; uniform vec3 uTenue; uniform vec3 uCrema;
        varying vec3 vN; varying vec3 vP; varying vec3 vLocal;
        void main() {
          vec3 n = normalize(vN);
          vec3 v = normalize(-vP);
          float banda = 0.5 + 0.5 * sin(vLocal.y * 26.0);
          vec3 base = mix(uTenue, uLaton, 0.35 + 0.65 * banda);
          vec3 luz = normalize(vec3(-0.25, 0.55, 0.85));
          float dif = clamp(dot(n, luz), 0.0, 1.0);
          float ref = clamp(dot(reflect(-luz, n), v), 0.0, 1.0);
          float esp = pow(ref, 52.0);
          float halo = pow(ref, 8.0);
          float filo = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 2.4);
          vec3 c = base * (0.34 + 0.72 * dif)
                 + uCrema * esp * 1.05
                 + uLaton * halo * 0.22
                 + uLaton * filo * 0.4;
          gl_FragColor = vec4(c, 1.0);
        }`,
    }));

    /* La lámina: el póster más un barniz. Tres capas, todas view-dependent,
       que en reposo casi no se notan y al ladear el cartel se encienden:
       un especular Blinn-Phong de exponente alto con tinte crema, una
       veladura Fresnel suave en el filo y una banda diagonal ancha que se
       desplaza con la inclinación, como el cristal de una vitrina. La leve
       comba del papel (`uComba`) se aplica sobre las tangentes en espacio de
       vista, así que el destello barre el cartel en vez de encenderse de
       golpe. `transparent` se conserva para no alterar el orden de dibujo:
       el halo del proyector va detrás y se pinta antes. */
    const lamina = new THREE.Mesh(
      new THREE.PlaneGeometry(ANCHO, ALTO),
      new THREE.ShaderMaterial({
        uniforms: {
          uMapa: { value: null },
          uCrema: { value: CREMA },
          uLadeo: { value: new THREE.Vector2(0, 0) },   // (rotación X, rotación Y) en radianes
          uFuerza: { value: 0 },                        // 0 en reposo, 1 en el tope
          uOpacidad: { value: 1 },
          uComba: { value: 0.11 },
        },
        vertexShader: `
          varying vec2 vUv; varying vec3 vN; varying vec3 vP;
          varying vec3 vT; varying vec3 vB;
          void main() {
            vUv = uv;
            vN = normalize(normalMatrix * normal);
            vT = normalize(normalMatrix * vec3(1.0, 0.0, 0.0));
            vB = normalize(normalMatrix * vec3(0.0, 1.0, 0.0));
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vP = mv.xyz;
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          uniform sampler2D uMapa;
          uniform vec3 uCrema;
          uniform vec2 uLadeo;
          uniform float uFuerza;
          uniform float uOpacidad;
          uniform float uComba;
          varying vec2 vUv; varying vec3 vN; varying vec3 vP;
          varying vec3 vT; varying vec3 vB;
          void main() {
            vec4 tinta = texture2D(uMapa, vUv);
            vec3 c = tinta.rgb;

            vec3 n = normalize(vN
              + vT * (vUv.x - 0.5) * uComba
              + vB * (vUv.y - 0.5) * uComba);
            vec3 v = normalize(-vP);
            vec3 luz = normalize(vec3(-0.22, 0.34, 1.0));
            vec3 h = normalize(luz + v);

            float esp = pow(clamp(dot(n, h), 0.0, 1.0), 110.0);
            float fres = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 1.8);

            /* La banda del cristal: ancha, diagonal y corrida por el ladeo. */
            float diag = 0.55 * vUv.x + 0.45 * (1.0 - vUv.y);
            float centro = 0.46 + uLadeo.y * 1.45 + uLadeo.x * 0.95;
            float d = (diag - centro) * 3.2;
            float banda = exp(-(d * d));

            c += uCrema * esp * (0.30 + 1.30 * uFuerza);
            c += uCrema * fres * (0.10 + 0.34 * uFuerza);
            c += uCrema * banda * (0.030 + 0.150 * uFuerza);

            gl_FragColor = vec4(c, tinta.a * uOpacidad);
          }`,
        transparent: true,
      }),
    );
    lamina.position.z = 0.03;

    /* La luz del proyector detrás del póster: halo aditivo más ancho que
       el marco, que es lo que hace que el ganador se sienta iluminado. */
    const luz = new THREE.Mesh(
      new THREE.PlaneGeometry(ANCHO * 3.4, ALTO * 2.4),
      new THREE.MeshBasicMaterial({
        map: TEX_HALO, blending: THREE.AdditiveBlending,
        transparent: true, depthWrite: false, depthTest: false, opacity: 0,
      }),
    );
    luz.position.z = -0.6;

    const sello = new THREE.Mesh(
      new THREE.PlaneGeometry(1.72, 0.86),
      new THREE.MeshBasicMaterial({
        map: (() => {
          const c = document.createElement('canvas');
          c.width = 512; c.height = 256;
          const x = c.getContext('2d');
          x.strokeStyle = '#c9566c'; x.lineWidth = 9;
          x.strokeRect(14, 14, 484, 228);
          x.strokeRect(30, 30, 452, 196);
          x.fillStyle = '#c9566c';
          x.font = `400 82px ${PILA_DISPLAY}`;
          x.textAlign = 'center'; x.textBaseline = 'middle';
          textoEspaciado(x, 'VETADA', 256, 132, 12);
          return texturaDe(c);
        })(),
        transparent: true, depthWrite: false, depthTest: false,
        blending: THREE.AdditiveBlending, opacity: 0,
      }),
    );
    sello.position.z = 0.2;
    sello.rotation.z = -14 * Math.PI / 180;
    sello.visible = false;

    /* El cartel —marco, lámina y sello— es lo único que se ladea: el halo del
       proyector es luz de cabina y se queda quieto colgando de `caja`, que es
       quien lleva el vuelo (posición y escala). El sello va dentro porque
       está impreso sobre el cartel, no flotando delante. */
    const cartel = new THREE.Group();
    cartel.add(marco, lamina, sello);

    const caja = new THREE.Group();
    caja.add(luz, cartel);
    caja.visible = false;
    grupo.add(caja);

    let vuelo = null, tSello = -1;
    const ESCALA_SALIDA = POSTER_ANCHO / ANCHO;

    /* Topes del ladeo: ±26° en Y (el eje del gesto largo) y ±16° en X. Los
       publica el módulo porque son del cartel; quien escucha el puntero los
       lee para saturar el arrastre contra ellos. */
    const TOPE_X = (16 * Math.PI) / 180;
    const TOPE_Y = (26 * Math.PI) / 180;

    /* Retorno: muelle amortiguado analítico (ω 14 rad/s, ζ 0.62). Da un
       sobrepaso del 8 % a los 0.29 s y se apaga a los 0.6 s sin llegar a
       oscilar. Analítico y no integrado para que no dependa del cuadro. */
    const RETORNO = 0.6, OMEGA = 14, ZETA = 0.62;
    const OMEGA_D = OMEGA * Math.sqrt(1 - ZETA * ZETA);
    const muelleFactor = (a) => (a >= 1 ? 0 : Math.exp(-ZETA * OMEGA * a * RETORNO)
      * (Math.cos(OMEGA_D * a * RETORNO)
        + (ZETA * OMEGA / OMEGA_D) * Math.sin(OMEGA_D * a * RETORNO)));

    let ladeoX = 0, ladeoY = 0, metaLadeoX = 0, metaLadeoY = 0;
    let inclinando = false, muelle = null, ultimoT = 0;

    function aplomar() {
      ladeoX = ladeoY = metaLadeoX = metaLadeoY = 0;
      inclinando = false;
      muelle = null;
      cartel.rotation.set(0, 0, 0);
      lamina.material.uniforms.uLadeo.value.set(0, 0);
      lamina.material.uniforms.uFuerza.value = 0;
    }

    return {
      grupo,
      topes: { x: TOPE_X, y: TOPE_Y },
      enEscena() { return caja.visible; },
      orientacion() { return { x: ladeoX, y: ladeoY }; },
      mostrar(t0, titulo, desdeX, desde = { escala: 1, z: 0 }) {
        caja.visible = true;
        const u = lamina.material.uniforms;
        u.uMapa.value?.dispose();
        u.uMapa.value = texturaDe(lienzoPoster(titulo));
        aplomar();
        sello.visible = false;
        sello.material.opacity = 0;
        tSello = -1;
        vuelo = { t0, desdeX, escala: ESCALA_SALIDA * desde.escala, z: desde.z, dur: 0.78 };
        caja.position.set(desdeX, 0, vuelo.z);
        caja.scale.setScalar(vuelo.escala);
      },
      sellar(t0) { sello.visible = true; tSello = t0; },
      /* Radianes objetivo, ya saturados por quien escucha el puntero; aquí se
         recortan contra el tope por si acaso. Inclinar mata el muelle. */
      inclinar(x, y) {
        metaLadeoX = Math.max(-TOPE_X, Math.min(TOPE_X, x));
        metaLadeoY = Math.max(-TOPE_Y, Math.min(TOPE_Y, y));
        inclinando = true;
        muelle = null;
      },
      soltar() {
        if (!inclinando) return;
        inclinando = false;
        metaLadeoX = metaLadeoY = 0;
        muelle = { t0: ultimoT, x: ladeoX, y: ladeoY };
      },
      /* Prueba de impacto: sólo la lámina y el marco. El halo del proyector es
         mucho más ancho que el cartel y queda fuera a propósito. */
      impacta(raycaster) {
        if (!caja.visible) return false;
        return raycaster.intersectObjects([lamina, marco], false).length > 0;
      },
      esconder() { caja.visible = false; vuelo = null; tSello = -1; aplomar(); },
      update(t, dt) {
        if (!caja.visible) return;
        ultimoT = t;
        if (vuelo) {
          const a = Math.min(1, (t - vuelo.t0) / vuelo.dur);
          const e = 1 - Math.pow(1 - a, 3);
          caja.position.set(vuelo.desdeX * (1 - e), 0.62 * e, vuelo.z + (2.4 - vuelo.z) * e);
          const s = vuelo.escala + (0.80 - vuelo.escala) * e;
          caja.scale.setScalar(s);
          marco.material.visible = a > 0.45;
          lamina.material.uniforms.uOpacidad.value = 1;
          luz.material.opacity = 0.5 * e;
          if (a >= 1) vuelo = null;
        }
        if (inclinando) {
          const k = Math.min(1, dt * 30);
          ladeoX += (metaLadeoX - ladeoX) * k;
          ladeoY += (metaLadeoY - ladeoY) * k;
        } else if (muelle) {
          const a = (t - muelle.t0) / RETORNO;
          const f = muelleFactor(a);
          ladeoX = muelle.x * f;
          ladeoY = muelle.y * f;
          if (a >= 1) { ladeoX = 0; ladeoY = 0; muelle = null; }
        }
        cartel.rotation.x = ladeoX;
        cartel.rotation.y = ladeoY;
        const u = lamina.material.uniforms;
        u.uLadeo.value.set(ladeoX, ladeoY);
        u.uFuerza.value = Math.min(1, Math.hypot(ladeoX / TOPE_X, ladeoY / TOPE_Y));
        if (tSello >= 0) {
          const a = Math.min(1, (t - tSello) / 0.42);
          sello.scale.setScalar(2.4 - 1.4 * CURVA_SELLO(a));
          sello.material.opacity = Math.min(1, a * 2.4);
        }
      },
    };
  }

  /* ── Sala3D ────────────────────────────────────────────────────────
     El controlador: lleva la máquina de fases y le manda a cada módulo.
     Ningún módulo visual sabe en qué fase va el giro; eso vive aquí, que
     es justo lo que en react-three-fiber sería el estado del padre. */
  const lienzo = $('lienzo');
  const renderizador = new THREE.WebGLRenderer({
    canvas: lienzo, antialias: true, alpha: true, powerPreference: 'low-power',
  });
  renderizador.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderizador.autoClear = false;
  renderizador.outputColorSpace = THREE.LinearSRGBColorSpace;

  const escenaEsc = new THREE.Scene();
  const camaraEsc = new THREE.PerspectiveCamera(FOV, 1, 0.1, 60);
  const escenaMar = new THREE.Scene();
  const camaraMar = new THREE.OrthographicCamera(0, 1, 0, -1, -100, 100);

  const grupoTelon = new THREE.Group();
  const grupoTambores = new THREE.Group();
  const grupoConteo = new THREE.Group();
  const grupoGanador = new THREE.Group();
  const grupoMarquesina = new THREE.Group();
  escenaEsc.add(grupoTambores, grupoTelon, grupoConteo, grupoGanador);
  escenaMar.add(grupoMarquesina);

  const telon = crearTelon(grupoTelon);
  const marquesina = crearMarquesina(grupoMarquesina);
  const tambores = crearTambores(grupoTambores);
  const conteo = crearConteo(grupoConteo);
  const ganador = crearGanador(grupoGanador);

  /* Un fondo propio para la caja del escenario: el terciopelo de la casa,
     para que el 3D y el CSS arranquen del mismo negro vinoso. */
  const fondo = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0.055, 0.02, 0.038) }),
  );
  fondo.position.z = -7;
  escenaEsc.add(fondo);

  const tablero = $('tablero');
  const escenarioCaja = $('escenario');
  let ANCHO_L = 1, ALTO_L = 1;
  let banda = { x: 0, y: 0, w: 1, h: 1 };
  let bandaMar = { x: 0, y: 0, w: 1, h: 1 };
  let distancia = 9.8;

  function medir() {
    const caja = tablero.getBoundingClientRect();
    if (caja.width < 2 || caja.height < 2) return;
    ANCHO_L = Math.round(caja.width);
    ALTO_L = Math.round(caja.height);
    renderizador.setSize(ANCHO_L, ALTO_L, false);

    const esc = escenarioCaja.getBoundingClientRect();
    const x = Math.round(esc.left - caja.left);
    const arriba = Math.round(esc.top - caja.top);
    const w = Math.max(1, Math.round(esc.width));
    const h = Math.max(1, Math.round(esc.height));
    banda = { x, y: Math.max(0, ALTO_L - arriba - h), w, h };
    bandaMar = { x: 0, y: Math.max(1, ALTO_L - arriba), w: ANCHO_L, h: Math.max(1, arriba) };

    const proporcion = w / h;
    camaraEsc.aspect = proporcion;
    /* Si la caja se angosta, la cámara se retira para que los tres tambores
       sigan cabiendo: el encuadre vertical manda, el ancho es el mínimo. */
    const alto = Math.max(ALTO_VISTA, ANCHO_MINIMO / proporcion);
    distancia = (alto / 2) / Math.tan((FOV * Math.PI) / 360);
    camaraEsc.updateProjectionMatrix();
    /* La cámara del escenario no se mueve NUNCA: se queda en el eje, a la
       distancia que pide la caja, mirando al origen. Lo que se ladea es la
       tarjeta (el giroscopio y el ratón alimentan `ganador.inclinar`), que
       es lo que pidió el dueño. La marquesina ya tenía cámara fija. */
    camaraEsc.position.set(0, 0, distancia);
    camaraEsc.lookAt(0, 0, 0);

    /* El paño recogido está escrito en fracciones del ancho del escenario y
       su borde exterior tiene que pegar al canto: el telón necesita saber
       cuánto escenario se ve en su plano (z 1.6), que cambia con la caja. */
    const medioAlto = (alto / 2) * (distancia - 1.6) / distancia;
    telon.encuadrar(medioAlto * proporcion, medioAlto);

    camaraMar.right = ANCHO_L;
    camaraMar.bottom = -ALTO_L;
    camaraMar.updateProjectionMatrix();

    const puntos = [...document.querySelectorAll('.foco')].map((luz) => {
      const r = luz.getBoundingClientRect();
      return { x: r.left - caja.left + r.width / 2, y: -(r.top - caja.top + r.height / 2) };
    });
    if (puntos.length) marquesina.colocar(puntos);
  }

  /* ── Giroscopio y ratón: ladean la TARJETA, no la escena ──────────
     La cámara del escenario está clavada en el eje (`medir`). El aparato y
     el puntero alimentan el mismo destino que el arrastre, con los topes del
     cartel; el arrastre manda sobre los dos y el muelle del módulo devuelve
     el cartel al aplomo en cuanto la fuente ambiente se apaga.

     El sentido es el mismo que tenía la cámara que orbitaba hasta la rev. 3
     —ladear el aparato a la derecha enseña el costado derecho del cartel—,
     que es «asomarse», no «empujar»: por eso el signo es contrario al del
     arrastre, donde la mano agarra el cartel y lo gira. */
  let metaCartelX = 0, metaCartelY = 0;   // radianes, ya con los topes del cartel
  let suaveX = 0, suaveY = 0;             // filtrados: lo que ve el cartel
  let ambienteVivo = false, ladeando = false;
  let giroscopioPedido = false;

  const ZONA_MUERTA = 0.10;               // fracción del recorrido que no cuenta
  const FRACCION_RATON = 0.40;            // el hover ladea el 40 % de los topes

  /* Zona muerta suave: ni tiembla en el centro ni salta al salir de ella. */
  function fuera(v, rango) {
    const n = Math.max(-1, Math.min(1, v / rango));
    const m = Math.abs(n);
    if (m <= ZONA_MUERTA) return 0;
    return (n < 0 ? -1 : 1) * (m - ZONA_MUERTA) / (1 - ZONA_MUERTA);
  }

  function ambiente(x, y) {
    const movio = Math.abs(x - metaCartelX) + Math.abs(y - metaCartelY) > 0.002;
    metaCartelX = x;
    metaCartelY = y;
    ambienteVivo = true;
    if (movio) despertar();               // 60 fps mientras la tarjeta se mueve
  }

  function alGirarElAparato(evento) {
    if (arrastre) return;                 // el gesto manda: el giro no pelea
    if (evento.gamma === null && evento.beta === null) return;
    if (!ganador.enEscena()) { ambienteVivo = false; return; }
    ambiente(
      fuera((evento.beta ?? 45) - 45, 26) * ganador.topes.x,
      -fuera(evento.gamma ?? 0, 22) * ganador.topes.y,
    );
  }

  async function pedirGiroscopio() {
    if (giroscopioPedido) return;
    giroscopioPedido = true;
    const Ev = window.DeviceOrientationEvent;
    if (!Ev) return;
    try {
      if (typeof Ev.requestPermission === 'function') {
        const respuesta = await Ev.requestPermission();
        if (respuesta !== 'granted') return;   // sin permiso, cámara fija
      }
      window.addEventListener('deviceorientation', alGirarElAparato);
    } catch (error) {
      console.warn('El cine · sin giroscopio:', error);
    }
  }

  const conRaton = window.matchMedia('(hover: hover)').matches;

  /* ── El gesto: ladear el cartel ganador ──────────────────────────────
     Los listeners viven aquí, no dentro de `crearGanador`: el módulo sólo
     sabe inclinar, soltar y decir si el rayo le da. Así el puerto a
     react-three-fiber cambia esta parte por `onPointerDown` del `<mesh>` sin
     tocar el cartel. */
  const rayo = new THREE.Raycaster();
  const punto = new THREE.Vector2();
  const RECORRIDO = 130;                       // px de arrastre ≈ tope suave
  let arrastre = null;

  const saturar = (px, tope, base) => tope * Math.tanh(px / RECORRIDO
    + Math.atanh(Math.max(-0.999999, Math.min(0.999999, base / tope))));

  function hayCartel() {
    return activo && (fase === 'ganador' || fase === 'vetando') && ganador.enEscena();
  }

  /* NDC dentro de la banda del escenario, que es justo el viewport con el que
     se dibuja `camaraEsc`; el tablero incluye además la marquesina. */
  function apuntar(ev) {
    const r = escenarioCaja.getBoundingClientRect();
    punto.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    punto.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    rayo.setFromCamera(punto, camaraEsc);
  }

  function pintarCursor(ev) {
    if (!conRaton) return;
    if (arrastre) { escenarioCaja.style.cursor = 'grabbing'; return; }
    if (!hayCartel()) { escenarioCaja.style.cursor = ''; return; }
    apuntar(ev);
    escenarioCaja.style.cursor = ganador.impacta(rayo) ? 'grab' : '';
  }

  /* Con cartel en escena el tablero no hace scroll: el dedo ladea. */
  function ajustarGesto() {
    const vivo = hayCartel();
    tablero.style.touchAction = vivo ? 'none' : '';
    tablero.style.userSelect = vivo ? 'none' : '';
    tablero.style.webkitUserSelect = vivo ? 'none' : '';
    if (!vivo) {
      if (arrastre) soltarCartel(null);
      escenarioCaja.style.cursor = '';
    }
  }

  function soltarCartel(ev) {
    if (!arrastre) return;
    if (ev && ev.pointerId !== arrastre.id) return;
    const id = arrastre.id;
    arrastre = null; // lostpointercapture puede reentrar al liberar la captura
    try { escenarioCaja.releasePointerCapture(id); } catch { /* ya se fue */ }
    /* Tras el arrastre manda el muelle: la fuente ambiente vuelve a hablar
       con el siguiente movimiento del puntero o del aparato, no antes. */
    ambienteVivo = false; ladeando = false;
    metaCartelX = 0; metaCartelY = 0; suaveX = 0; suaveY = 0;
    ganador.soltar();
    if (conRaton) escenarioCaja.style.cursor = '';
    despertar();
  }

  escenarioCaja.addEventListener('pointerdown', (ev) => {
    if (!hayCartel() || arrastre) return;
    /* La ficha y los botones del ganador son DOM encima del lienzo: si el
       toque nace ahí, no es el cartel. */
    if (ev.target?.closest?.('.capa-3d')) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    apuntar(ev);
    if (!ganador.impacta(rayo)) return;
    const base = ganador.orientacion();
    arrastre = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, base };
    ganador.inclinar(base.x, base.y); // sujetar cancela el muelle sin cambiar el ángulo
    try { escenarioCaja.setPointerCapture(ev.pointerId); }
    catch { soltarCartel(null); return; }
    window.getSelection?.()?.removeAllRanges?.();
    if (conRaton) escenarioCaja.style.cursor = 'grabbing';
    ev.preventDefault();
    despertar();
  });

  escenarioCaja.addEventListener('pointermove', (ev) => {
    if (!arrastre || ev.pointerId !== arrastre.id) return;
    ganador.inclinar(
      saturar(ev.clientY - arrastre.y, ganador.topes.x, arrastre.base.x),
      saturar(ev.clientX - arrastre.x, ganador.topes.y, arrastre.base.y),
    );
    ev.preventDefault();
  });

  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((nombre) => {
    escenarioCaja.addEventListener(nombre, soltarCartel);
  });

  if (conRaton) {
    tablero.addEventListener('pointermove', (e) => {
      pintarCursor(e);
      if (arrastre) return;            // congelado mientras se arrastra el cartel
      if (!ganador.enEscena()) { ambienteVivo = false; return; }
      /* El puntero se mide contra la banda del escenario, que es donde vive
         el cartel; el tablero incluye además la marquesina. */
      const r = escenarioCaja.getBoundingClientRect();
      const nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
      const ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
      ambiente(
        -ny * FRACCION_RATON * ganador.topes.x,
        -nx * FRACCION_RATON * ganador.topes.y,
      );
    });
    tablero.addEventListener('pointerleave', () => {
      escenarioCaja.style.cursor = '';
      if (arrastre) return;
      metaCartelX = 0; metaCartelY = 0;
      ambienteVivo = false;            // el muelle devuelve el cartel al aplomo
      despertar();
    });
  }


  /* ── El reloj: 20 cuadros en reposo, 60 cuando algo se mueve, 0 si la
     pestaña se esconde o si la cabina manda la versión CSS ─────────── */
  let activo = false, pintando = 0, ultimo = 0, siguiente = 0;
  let reloj = 0, altoHasta = 0, fase = 'reposo';

  const despertar = () => { altoHasta = reloj + 2.2; };
  /* Arrastrando se pinta a 60 aunque el despertar se haya agotado: un gesto
     continuo puede durar más de 2.2 s y no debe caer a 20. */
  const cuadrosPorSegundo = () => (arrastre || reloj < altoHasta
    || ['conteo', 'girando', 'finalistas', 'vetando'].includes(fase) ? 60 : 20);

  function pintar(ahora) {
    pintando = requestAnimationFrame(pintar);
    const t = ahora / 1000;
    if (t < siguiente) return;
    siguiente = t + 1 / cuadrosPorSegundo() - 0.002;
    const dt = Math.min(0.05, Math.max(0.001, t - ultimo));
    ultimo = t;
    reloj += dt;

    /* La cámara ya está puesta por `medir` y no se toca. Lo único que se
       persigue aquí es el ladeo ambiente del cartel: el destino del
       giroscopio o del ratón, filtrado para que no tiemble, servido al
       módulo por la misma puerta que el arrastre. */
    if (arrastre) {
      ladeando = false;
    } else if (ambienteVivo && ganador.enEscena()) {
      if (Math.abs(metaCartelX - suaveX) + Math.abs(metaCartelY - suaveY) > 0.0015) despertar();
      const k = Math.min(1, dt * 6);
      suaveX += (metaCartelX - suaveX) * k;
      suaveY += (metaCartelY - suaveY) * k;
      ganador.inclinar(suaveX, suaveY);
      ladeando = true;
    } else if (ladeando || ambienteVivo) {
      ambienteVivo = false; ladeando = false;
      metaCartelX = 0; metaCartelY = 0;
      suaveX = 0; suaveY = 0;
      if (ganador.enEscena()) ganador.soltar();
    }

    telon.update(reloj, dt);
    marquesina.update(reloj, dt);
    tambores.update(reloj, dt);
    conteo.update(reloj, dt);
    ganador.update(reloj, dt);

    renderizador.setScissorTest(false);
    renderizador.setClearColor(0x000000, 0);
    renderizador.setViewport(0, 0, ANCHO_L, ALTO_L);
    renderizador.clear();

    renderizador.setScissorTest(true);
    renderizador.setViewport(banda.x, banda.y, banda.w, banda.h);
    renderizador.setScissor(banda.x, banda.y, banda.w, banda.h);
    renderizador.setClearColor(0x12080c, 1);
    renderizador.clear();
    renderizador.render(escenaEsc, camaraEsc);

    renderizador.setViewport(0, 0, ANCHO_L, ALTO_L);
    renderizador.setScissor(bandaMar.x, bandaMar.y, bandaMar.w, bandaMar.h);
    renderizador.render(escenaMar, camaraMar);
    renderizador.setScissorTest(false);
  }

  function correr(v) {
    if (v === activo) return;
    activo = v;
    if (v) {
      medir();
      ultimo = performance.now() / 1000;
      siguiente = 0;
      despertar();
      if (!document.hidden) pintando = requestAnimationFrame(pintar);
    } else if (pintando) {
      cancelAnimationFrame(pintando);
      pintando = 0;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (pintando) { cancelAnimationFrame(pintando); pintando = 0; } }
    else if (activo && !pintando) { ultimo = performance.now() / 1000; siguiente = 0; pintando = requestAnimationFrame(pintar); }
  });

  new ResizeObserver(() => { if (activo) medir(); }).observe(tablero);
  window.addEventListener('resize', () => { if (activo) medir(); });

  lienzo.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    correr(false);
    sinTresD('se perdió el contexto WebGL');
  });

  /* La tira de un tambor: siete pósters de la casa y el finalista en una
     celda al azar, que es la que el giro tiene que dejar de frente. */
  function tira3D(finalista, quieto) {
    const otros = barajar(estado.candidatos.filter((t) => t.id !== finalista.id)).slice(0, CELDAS - 1);
    if (!otros.length) otros.push(finalista);
    const destino = quieto ? 0 : Math.floor(Math.random() * CELDAS);
    const celdas = [];
    let k = 0;
    for (let i = 0; i < CELDAS; i += 1) {
      if (i === destino) celdas.push(finalista);
      else { celdas.push(otros[k % otros.length]); k += 1; }
    }
    return { celdas, destino };
  }

  let finalistasEnEscena = [];

  sala3D = {
    /* El telón recibe el reloj, como los tambores y el ganador: la curva es
       temporizada y necesita saber cuándo arranca el tramo. */
    telon(abierto) { telon.abrir(reloj, abierto); despertar(); },
    reposo() {
      soltarCartel(null);
      tambores.esconder(); ganador.esconder();
      conteo.setNumero(null); conteo.setHaz(false);
      ajustarGesto();
      despertar();
    },
    conteo(numero) {
      conteo.setNumero(numero);
      conteo.setHaz(numero !== null);
      despertar();
    },
    montarTambores(finalistas, quietos = false) {
      finalistasEnEscena = finalistas;
      soltarCartel(null);
      ganador.esconder();
      conteo.setNumero(null); conteo.setHaz(false);
      tambores.montar(finalistas.map((f) => tira3D(f, quietos)));
      ajustarGesto();
      despertar();
    },
    girarTambores(base, paroJuntos, corto) {
      tambores.girar(reloj, base, paroJuntos, corto);
      despertar();
    },
    elegido(indice) { tambores.setElegido(indice); despertar(); },
    ganador(titulo) {
      const i = Math.max(0, finalistasEnEscena.findIndex((t) => t.id === titulo.id));
      const n = Math.max(1, finalistasEnEscena.length);
      soltarCartel(null);
      ganador.mostrar(reloj, titulo, (i - (n - 1) / 2) * SEPARACION, {
        escala: ESCALA_TAMBOR, z: -RADIO + RADIO * ESCALA_TAMBOR,
      });
      /* En cuanto el póster sale del tambor, los tres se van a la sombra:
         si no, el ganador se ve dos veces, en el marco y en su tambor. */
      tambores.setElegido(-1);
      ajustarGesto();
      despertar();
    },
    sello() { ganador.sellar(reloj); despertar(); },
    limpiar() {
      soltarCartel(null);
      tambores.esconder(); ganador.esconder();
      conteo.setNumero(null); conteo.setHaz(false);
      ajustarGesto();
      despertar();
    },
    focos(paso, modo) { marquesina.setPatron(paso, modo); },
    setFase(f) { fase = f; ajustarGesto(); despertar(); },
    encender(v) { correr(v); ajustarGesto(); },
    pedirGiroscopio,
  };

  estado.hay3D = true;
  aplicarVersion();
  pintarVersion();
  armarFocos();
}
</script>
