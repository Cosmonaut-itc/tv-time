<title>El cine en tres dimensiones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   El cine · prototipo 3D
   La paleta, las tipografías y la curva son las de la app; no se reinventan.
   El bloque «CSS de hoy» está copiado del globals.css real para que el
   comparador enfrente la escena 3D contra la sala verdadera, no una imitación.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --terciopelo: #12080c;
  --foso: #0b0507;
  --vino: #4e1122;
  --vino-claro: #8e2438;
  --laton: #c9a227;
  --laton-tenue: #8a6f1c;
  --crema: #f2e5c6;
  --crema-tenue: #9a8e75;
  --sombra: rgba(0, 0, 0, 0.55);
  --display: "Copperplate", "Copperplate Gothic Light", "Futura",
    "Century Gothic", "Trebuchet MS", "Cinzel", sans-serif;
  --cuerpo: "Optima", "Avenir Next", "Futura", "Segoe UI", system-ui,
    sans-serif;
  --datos: "DIN Alternate", "Avenir Next Condensed", ui-monospace, monospace;
  --curva-telon: cubic-bezier(0.66, 0, 0.2, 1);
  --brillo-firma: 0.5;
}

body {
  margin: 0;
  min-height: 100dvh;
  color: var(--crema);
  background: var(--terciopelo);
  font-family: var(--cuerpo);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

* { box-sizing: border-box; }

button {
  border-radius: 2px;
  font-family: var(--datos);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  touch-action: manipulation;
  transition:
    transform 0.12s ease,
    background 0.2s ease,
    color 0.2s ease,
    border-color 0.2s ease;
}
button:active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--laton); outline-offset: 3px; }
button:disabled { opacity: 0.35; cursor: not-allowed; }

.solo-lectores {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ── La sala: la misma columna de la app ─────────────────────────── */

.sala {
  display: flex;
  flex: 1;
  flex-direction: column;
  width: 100%;
  max-width: 460px;
  min-height: 100dvh;
  margin: 0 auto;
  padding-top: env(safe-area-inset-top, 0px);
  background: radial-gradient(
    120% 55% at 50% 0%,
    #1e1014 0%,
    var(--terciopelo) 55%,
    var(--foso) 100%
  );
}

/* El tablero abraza marquesina y escenario: es el rectángulo exacto que
   cubre el único lienzo WebGL de la página, dividido en dos franjas con
   `setScissor` (bombillas arriba, sala abajo). */
.tablero {
  position: relative;
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
}

.lienzo {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100%;
  visibility: hidden;
}
.tablero.tresd .lienzo { visibility: visible; }

/* ── Marquesina ──────────────────────────────────────────────────── */

.marquesina {
  position: relative;
  z-index: 2;
  flex: none;
  padding: 14px 16px 12px;
  text-align: center;
}

.focos {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding: 6px 0;
}

.foco {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--laton-tenue);
  box-shadow: 0 0 0 rgba(201, 162, 39, 0);
}

.foco.on {
  background: #ffe9a8;
  box-shadow:
    0 0 7px 2px rgba(255, 214, 120, 0.75),
    0 0 18px 6px rgba(201, 162, 39, 0.28);
}

.tablero.tresd .focos { visibility: hidden; }

.rotulo {
  padding: 12px 10px 10px;
  border: 1px solid var(--laton-tenue);
  border-right-width: 3px;
  border-left-width: 3px;
  background: linear-gradient(
    180deg,
    rgba(78, 17, 34, 0.55),
    rgba(18, 8, 12, 0.2)
  );
}

.rotulo h1 {
  margin: 0;
  color: var(--laton);
  font-family: var(--display);
  font-size: 27px;
  font-weight: 400;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  text-shadow:
    0 1px 0 #3a2a08,
    0 0 22px rgba(201, 162, 39, 0.35);
}

.rotulo .abanico {
  display: block;
  width: 96px;
  height: 8px;
  margin: 7px auto 0;
  background: linear-gradient(
    90deg,
    transparent 0 6%,
    var(--laton-tenue) 6% 8%,
    transparent 8% 22%,
    var(--laton-tenue) 22% 24%,
    transparent 24% 42%,
    var(--laton) 42% 58%,
    transparent 58% 76%,
    var(--laton-tenue) 76% 78%,
    transparent 78% 92%,
    var(--laton-tenue) 92% 94%,
    transparent 94%
  );
}

.fecha {
  margin: 9px 0 0;
  color: var(--crema-tenue);
  font-family: var(--datos);
  font-size: 10.5px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
}
.fecha b { color: var(--laton); font-weight: 400; }

/* ── Escenario y telón (CSS real de la app) ──────────────────────── */

.escenario {
  position: relative;
  z-index: 2;
  flex: 1 1 auto;
  min-height: min(58vh, 520px);
  margin: 4px 12px 0;
  border: 1px solid rgba(201, 162, 39, 0.22);
  border-bottom: none;
  background: #080407;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* En 3D el escenario deja de pintar su fondo: el lienzo que está debajo es
   quien lo pinta, y el marco de latón del recuadro sigue siendo DOM. */
.tablero.tresd .escenario { background: transparent; }
.tablero.tresd .telon,
.tablero.tresd .pantalla,
.tablero.tresd .conteo,
.tablero.tresd .sello { display: none; }

.telon {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 52%;
  z-index: 6;
  background: repeating-linear-gradient(
    90deg,
    #3c0c1a 0,
    #6b1a2e 11px,
    #8e2438 20px,
    #6b1a2e 29px,
    #3c0c1a 40px
  );
  box-shadow: inset 0 22px 40px rgba(0, 0, 0, 0.55), 0 0 30px rgba(0, 0, 0, 0.6);
  transition: transform 1.15s cubic-bezier(0.66, 0, 0.2, 1);
}

.telon::after {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 26px;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
}

.telon.izq { left: 0; transform: translateX(0); }
.telon.der { right: 0; transform: translateX(0); }

.escenario.abierto .telon.izq { transform: translateX(-101%); }
.escenario.abierto .telon.der { transform: translateX(101%); }

/* La firma va bordada en el terciopelo, no al pie: en reposo el telón es lo
   único que se ve. Es DOM en las dos versiones —se lee y se selecciona— y su
   resplandor sigue el pulso de las bombillas de la marquesina. */
.firma-telon {
  position: absolute;
  z-index: 7;
  top: 50%;
  left: 50%;
  width: min(232px, 74%);
  margin: 0;
  transform: translate(-50%, -50%);
  pointer-events: none;
  color: rgba(242, 229, 198, 0.5);
  font-family: var(--display);
  font-size: 19px;
  line-height: 1.75;
  letter-spacing: 0.12em;
  text-align: center;
  text-shadow:
    0 1px 0 rgba(0, 0, 0, 0.6),
    0 0 calc(6px + 14px * var(--brillo-firma))
      rgba(201, 162, 39, calc(0.1 + 0.3 * var(--brillo-firma)));
  transition: opacity 320ms ease;
}

.escenario.abierto .firma-telon { z-index: 1; opacity: 0; }

.firma-telon .mascota-claude {
  width: 1.4em;
  height: 1.05em;
  vertical-align: -0.1em;
}

.pantalla {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  padding: 16px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.reposo {
  max-width: 300px;
  color: var(--crema-tenue);
  font-family: var(--datos);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  line-height: 1.9;
  text-align: center;
  text-transform: uppercase;
}

/* ── Carretes ────────────────────────────────────────────────────── */

/* Ventana y celda comparten proporción; 22 px = dos huecos y seis bordes. */

.carretes {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 100%;
}

.carrete {
  position: relative;
  box-sizing: content-box;
  height: auto;
  width: calc((100% - 22px) / 3);
  max-width: calc((100% - 16px) / 3);
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border: 1px solid rgba(201, 162, 39, 0.3);
  background: #050204;
  box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.9);
}

.carrete .tira {
  display: flex;
  flex-direction: column;
  will-change: transform;
}

/* line-height 0 + imagen en block: sin esto cada celda arrastra el
   descender del inline y la tira aterriza corrida. */
.carrete .celda {
  position: relative;
  flex: none;
  width: 100%;
  aspect-ratio: 2 / 3;
  line-height: 0;
}

.carrete .celda img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.carrete .celda img.revelada { opacity: 1; }

.carrete .vidrio {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(0, 0, 0, 0.75) 0%,
    transparent 24%,
    transparent 76%,
    rgba(0, 0, 0, 0.75) 100%
  );
}

.carrete.elegido {
  border-color: var(--laton);
  box-shadow: 0 0 0 1px var(--laton), 0 0 22px rgba(201, 162, 39, 0.45);
}

.carrete.descartado { opacity: 0.28; filter: saturate(0.3); }

/* ── Ganador ─────────────────────────────────────────────────────── */

@keyframes entra {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.ganador {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  animation: entra 0.5s ease both;
}

.marco-laton {
  position: relative;
  width: 172px;
  padding: 7px;
  background: linear-gradient(145deg, var(--laton) 0%, #6E5410 42%, var(--laton) 58%, #4A390B 100%);
  clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px),
                     calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
}
.marco-laton > img { display: block; width: 100%; height: auto; }
.marco-laton.punteado { border: 2px dashed var(--laton); }

.ficha { text-align: center; }

.ficha h2 {
  margin: 0;
  font-family: var(--display);
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 0.13em;
  color: var(--crema);
  text-wrap: balance;
  line-height: 1.25;
}

.ficha .meta {
  margin: 6px 0 0;
  font-family: var(--datos);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--crema-tenue);
  font-variant-numeric: tabular-nums;
}

.saga {
  margin: 0 0 3px;
  font-family: var(--datos);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--laton);
}

.acciones {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 300px;
}

.btn-ver {
  flex: 2;
  min-height: 44px;
  padding: 13px 10px;
  font-size: 12px;
  border: none;
  color: #2A1B04;
  background: linear-gradient(180deg, #E8C65A, var(--laton) 55%, #8A6F1C);
  box-shadow: 0 2px 0 #5A470F, 0 6px 16px rgba(0,0,0,.5);
}

.btn-veto {
  flex: 1;
  min-height: 44px;
  padding: 13px 6px;
  font-size: 11px;
  background: transparent;
  color: var(--vino-claro);
  border: 1px solid rgba(142, 36, 56, 0.75);
}

.razon-veto {
  max-width: 300px;
  margin: 0;
  color: var(--crema-tenue);
  font-family: var(--datos);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  line-height: 1.5;
  text-align: center;
}

/* ── Conteo de proyector ─────────────────────────────────────────── */

.conteo {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  background: rgba(5, 2, 4, 0.92);
  font-family: var(--display);
  font-size: 78px;
  color: var(--crema);
}

/* Centrar la caja de la línea no centra el número: la caja la dicta la
   métrica de la tipografía y Copperplate la incumple por los dos lados. El
   corrimiento lo pone `ajusteOpticoDelNumero`, midiendo el glifo ya pintado. */
.conteo span {
  animation: pulso 0.55s ease both;
  display: block;
  position: relative;
  line-height: 1;
  font-variant-numeric: lining-nums tabular-nums;
}

.conteo .linea-base { display: inline-block; width: 0; height: 0; }

.conteo .aro {
  position: absolute;
  width: 130px;
  height: 130px;
  border: 1px solid rgba(242, 229, 198, 0.35);
  border-radius: 50%;
}

.conteo .cruz-h,
.conteo .cruz-v { position: absolute; background: rgba(242, 229, 198, 0.22); }
.conteo .cruz-h { width: 100%; height: 1px; }
.conteo .cruz-v { height: 100%; width: 1px; }

@keyframes pulso {
  from { opacity: 0; transform: scale(1.6); }
  to { opacity: 1; transform: scale(1); }
}

/* ── Sello de veto ───────────────────────────────────────────────── */

.sello {
  position: absolute;
  z-index: 7;
  top: 50%;
  left: 50%;
  font-family: var(--display);
  font-size: 38px;
  letter-spacing: 0.16em;
  color: #c9566c;
  border: 4px solid #c9566c;
  padding: 8px 18px;
  text-transform: uppercase;
  animation: sellar 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) both;
  pointer-events: none;
  mix-blend-mode: screen;
}

@keyframes sellar {
  from { opacity: 0; transform: translate(-50%, -50%) rotate(-16deg) scale(2.4); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}

/* ── Capa DOM sobre el lienzo (ficha y botones del ganador en 3D) ── */

.capa-3d {
  position: absolute;
  inset: auto 0 0;
  z-index: 4;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 34px 16px 16px;
  pointer-events: none;
  background: linear-gradient(to top, rgba(8, 4, 7, 0.94) 46%, rgba(8, 4, 7, 0));
}
.capa-3d.viva { display: flex; }
.tablero:not(.tresd) .capa-3d { display: none; }
.capa-3d .ficha,
.capa-3d .acciones,
.capa-3d .razon-veto { pointer-events: auto; }

/* ── Foso ────────────────────────────────────────────────────────── */

.foso {
  flex: none;
  margin: 0 12px 12px;
  padding: 12px;
  border: 1px solid rgba(201, 162, 39, 0.22);
  border-top: 1px dashed rgba(201, 162, 39, 0.3);
  background: linear-gradient(180deg, rgba(78, 17, 34, 0.28), rgba(11, 5, 7, 0.9));
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.filtros { display: flex; gap: 6px; }

.filtro {
  flex: 1;
  min-height: 44px;
  padding: 8px 4px;
  font-size: 10px;
  background: transparent;
  color: var(--crema-tenue);
  border: 1px solid rgba(242, 229, 198, 0.18);
}

.filtro[aria-pressed="true"] {
  color: var(--laton);
  border-color: var(--laton);
  background: rgba(201, 162, 39, 0.1);
}

.filtro.senalada { box-shadow: 0 0 0 2px var(--laton), 0 0 20px rgba(201, 162, 39, 0.45); }

.etiqueta-entrada {
  margin: 0;
  font-family: var(--datos);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: center;
  color: var(--crema-tenue);
}

.btn-palanca {
  width: 100%;
  min-height: 52px;
  padding: 16px 12px;
  font-size: 13px;
  border: none;
  color: #2a1b04;
  background: linear-gradient(180deg, #e8c65a, var(--laton) 55%, #8a6f1c);
  box-shadow: 0 3px 0 #5a470f, 0 8px 20px rgba(0, 0, 0, 0.55);
}

.panel-vetos {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid rgba(242, 229, 198, 0.14);
  background: rgba(142, 36, 56, 0.12);
}

.panel-vetos.agotado { opacity: 0.45; }

.panel-vetos .etiqueta {
  font-family: var(--datos);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--crema-tenue);
}

.panel-vetos .fichas { display: flex; gap: 5px; }

.panel-vetos .ficha-veto {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1px solid var(--vino-claro);
  background: var(--vino-claro);
  transition: background 0.3s ease;
}

.panel-vetos .ficha-veto.usada { background: transparent; }

.bitacora {
  margin: 0 12px 12px;
  font-family: var(--datos);
  font-size: 9.5px;
  line-height: 1.7;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(242, 229, 198, 0.4);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.bitacora b { color: var(--laton); font-weight: 400; }

/* ── Cabina del prototipo ────────────────────────────────────────── */

.cabina-prototipo {
  flex: none;
  margin: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding: 11px 12px 12px;
  border: 1px dashed rgba(201, 162, 39, 0.32);
  background: rgba(11, 5, 7, 0.66);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.cabina-prototipo > legend,
.cabina-prototipo .titulo {
  font-family: var(--datos);
  font-size: 9.5px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--laton);
}

.mando {
  display: grid;
  grid-template-columns: 78px 1fr;
  align-items: center;
  gap: 8px;
}

.mando > .nombre {
  font-family: var(--datos);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--crema-tenue);
}

.grupo { display: flex; gap: 5px; }

.opcion {
  flex: 1;
  min-height: 44px;
  padding: 5px 4px;
  font-size: 9px;
  letter-spacing: 0.12em;
  background: transparent;
  color: var(--crema-tenue);
  border: 1px solid rgba(242, 229, 198, 0.16);
}

.opcion[aria-pressed="true"] {
  color: var(--laton);
  border-color: var(--laton);
  background: rgba(201, 162, 39, 0.1);
}

.nota-cabina {
  margin: 0;
  font-family: var(--datos);
  font-size: 8.5px;
  letter-spacing: 0.12em;
  line-height: 1.6;
  color: rgba(242, 229, 198, 0.34);
  text-transform: uppercase;
}

/* ── Movimiento reducido: la sala cae a la versión CSS y ésta acorta
      sus animaciones igual que en la app. ──────────────────────────── */

@media (prefers-reduced-motion: reduce) {
  .telon { transition-duration: 0.01ms; }
  .firma-telon { transition-duration: 0.01ms; }
  .carrete .tira { transition-duration: 0.01ms !important; }
  .ganador,
  .conteo span,
  .sello { animation: none; }
}
</style>

<div class="sala">
  <div class="tablero" id="tablero">
    <canvas class="lienzo" id="lienzo" aria-hidden="true"></canvas>

    <div class="marquesina">
      <div class="focos" id="focos-arriba"></div>
      <div class="rotulo">
        <h1>El cine</h1>
        <span class="abanico" aria-hidden="true"></span>
        <p class="fecha">Función privada · <b>Butaca de Félix</b></p>
      </div>
      <div class="focos" id="focos-abajo"></div>
    </div>

    <section class="escenario" id="escenario" aria-label="Escenario">
      <div class="telon izq" aria-hidden="true"></div>
      <div class="telon der" aria-hidden="true"></div>
      <p class="firma-telon" id="firma">
        Hecho con amor<br>por Félix y Claude
        <svg class="mascota-claude" viewBox="0 0 16 12" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
          <g fill="#D97757">
            <rect x="1" y="0" width="14" height="2"></rect>

/* La curva de los carretes de la app, resuelta por Newton para poder usarla
   también en la escena 3D: las dos versiones frenan idéntico. */
function curvaBezier(x1, y1, x2, y2) {
  const A = (a, b) => 1 - 3 * b + 3 * a;
  const B = (a, b) => 3 * b - 6 * a;
  const C = (a) => 3 * a;
  const calc = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
  const pend = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 6; i += 1) {
      const d = pend(t, x1, x2);
      if (Math.abs(d) < 1e-6) break;
      t -= (calc(t, x1, x2) - x) / d;
    }
    return calc(t, y1, y2);
  };
}

function textoEspaciado(c, texto, x, y, espaciado) {
  const anchos = [...texto].map((ch) => c.measureText(ch).width);

  let cursor = x - total / 2;
  [...texto].forEach((ch, i) => {
    c.fillText(ch, cursor, y);
    cursor += anchos[i] + espaciado;
  });
}

function pintarPoster(c, titulo, ancho, alto, conRotulo) {
  const [f1, f2, ac] = PALETAS[titulo.motivo] || PALETAS.mano;
  c.save();
  c.scale(ancho / 300, alto / 450);
  const grad = c.createLinearGradient(0, 0, 0, 450);
  grad.addColorStop(0, f2); grad.addColorStop(1, f1);
  c.fillStyle = grad; c.fillRect(0, 0, 300, 450);
  dibujarMotivo(c, titulo.motivo, ac, f2);
  c.save();
  c.globalAlpha = 0.35; c.strokeStyle = ac; c.lineWidth = 1;
  if (titulo.aMano) c.setLineDash([10, 7]);
  c.strokeRect(10, 10, 280, 430);
  c.restore();
  if (conRotulo !== false) {
    c.globalAlpha = 0.62; c.fillStyle = '#000'; c.fillRect(0, 368, 300, 82);
    c.globalAlpha = 1;
    const nom = titulo.nombre.length > 22 ? titulo.nombre.slice(0, 20) + '…' : titulo.nombre;
    c.fillStyle = '#F2E5C6'; c.font = `400 18px ${PILA_DISPLAY}`; c.textBaseline = 'alphabetic';
    textoEspaciado(c, nom.toUpperCase(), 150, 404, 1.2);
    c.fillStyle = '#9A8E75'; c.font = `400 12px ${PILA_DATOS}`;
    textoEspaciado(c, String(titulo.anio || '—'), 150, 426, 3);
  }
  c.restore();
}

const cachePoster = new Map();

  pintarPoster(c.getContext('2d'), titulo, 256, 384, true);
  cachePoster.set(titulo.id, c);
  return c;
}

const cacheURL = new Map();
function urlPoster(titulo) {
  if (!cacheURL.has(titulo.id)) cacheURL.set(titulo.id, lienzoPoster(titulo).toDataURL('image/png'));

/* Cuánto hay que correr el número para que su tinta quede al centro de su
   caja. Copiada de `conteo-logica.ts`: la métrica declarada no sirve —
   Copperplate no llega a la altura de mayúscula que dice tener. */
function ajusteOpticoDelNumero({ alto, lineaBase, tintaArriba, tintaAbajo }) {
  const centroDeLaTinta = lineaBase - (tintaArriba - tintaAbajo) / 2;
  return alto / 2 - centroDeLaTinta;
}

function centrarNumeroCSS(caja, ancla) {
  const rCaja = caja.getBoundingClientRect();
  const rAncla = ancla.getBoundingClientRect();
  const medidor = document.createElement('canvas').getContext('2d');
  const estilo = getComputedStyle(caja);
  medidor.font = `${estilo.fontWeight} ${estilo.fontSize} ${estilo.fontFamily}`;
  const m = medidor.measureText(caja.firstChild.textContent.trim());
  return ajusteOpticoDelNumero({
    alto: rCaja.height,
    lineaBase: rAncla.bottom - rCaja.top,
    tintaArriba: m.actualBoundingBoxAscent,
    tintaAbajo: m.actualBoundingBoxDescent,
  });
}

  },
  centrarConteo() {
    if (tableroEl.classList.contains('tresd')) return;
    const span = escenarioEl.querySelector('.conteo span');
    if (!span) return;
    const ancla = span.querySelector('.linea-base');
    span.style.top = `${centrarNumeroCSS(span, ancla).toFixed(2)}px`;
  },
  montarCarretes(tirasPorCarrete) {
    this.limpiar();
    const marco = document.createElement('div');
    marco.className = 'carretes';
    marco.innerHTML = tirasPorCarrete.map((tira) => `
      <div class="carrete">
        <div class="tira">${tira.map((t) => `
          <div class="celda"><img class="revelada" src="${urlPoster(t)}" alt=""></div>`).join('')}</div>
        <div class="vidrio"></div>
      </div>`).join('');
    pantallaEl.appendChild(marco);
    this.tiras = [...marco.querySelectorAll('.tira')];
  },
  girarTiras(base, paroJuntos, corto) {
    this.tiras.forEach((tira, indice) => {
      const duracion = corto ? 30 : base + (paroJuntos ? 0 : indice * base * 0.45);
      tira.style.transition = `transform ${duracion}ms cubic-bezier(.12,.72,.16,1)`;
      tira.style.transform = 'translateY(-93.3333333333%)';
    });
  },
  terminarTiras() {
    pantallaEl.querySelectorAll('.tira').forEach((tira) => {
      tira.style.transition = 'none';
      tira.style.transform = tira.children.length > 1 ? 'translateY(-93.3333333333%)' : 'translateY(0)';
    });
  },
  elegido(indice) {
    const carretes = [...pantallaEl.querySelectorAll('.carrete')];
    carretes.forEach((c, i) => {
      c.classList.toggle('elegido', i === indice);
      c.classList.toggle('descartado', indice !== null && i !== indice);
    });
  },
  ganador(titulo) {
    this.limpiar();
    pantallaEl.innerHTML = fichaGanador(titulo, 'css');
  },
  sello() {
    escenarioEl.querySelector('.sello')?.remove();
    const s = document.createElement('div');
    s.className = 'sello';
    s.setAttribute('aria-hidden', 'true');
    s.textContent = 'Vetada';
    escenarioEl.appendChild(s);
  },
  focos(paso, modo) {
    document.querySelectorAll('.foco').forEach((luz, indice) => {
      const encendida = modo === 'fiesta'
        ? paso % 2 === 0
        : (indice + paso) % (modo === 'girando' ? 3 : 4) === 0;
      luz.classList.toggle('on', encendida);
    });
  },
};

function fichaGanador(titulo, donde) {
  const marco = donde === 'css'
    ? `<div class="marco-laton${titulo.aMano ? ' punteado' : ''}">
         <img src="${urlPoster(titulo)}" alt="Póster de ${titulo.nombre}"></div>`
    : '';
  const vetosLibres = VETOS_POR_NOCHE - estado.vetados.size;
  return `<div class="ganador">
    ${marco}
    <div class="ficha">
      ${titulo.saga ? `<p class="saga">${titulo.saga} · ${titulo.orden}</p>` : ''}
      <h2>${titulo.nombre}</h2>
      <p class="meta">${titulo.tipo === 'serie' ? 'Serie' : 'Película'} · ${titulo.anio || 'sin año'}${titulo.servicio ? ' · ' + titulo.servicio : ''}</p>
    </div>
    <div class="acciones">
      <button class="btn-ver" type="button" data-accion="funcion">Esta vemos</button>
      <button class="btn-veto" type="button" data-accion="veto" ${vetosLibres ? '' : 'disabled'}>Veto</button>
    </div>
    <p class="razon-veto">${vetosLibres
      ? `Quedan ${vetosLibres} de ${VETOS_POR_NOCHE} vetos esta noche`
      : 'Se acabaron los vetos de la noche'}</p>
  </div>`;
}

/* ── El escenario activo: 3D si está listo, si no el CSS de hoy ───── */

let sala3D = null;
let tresDPendiente = null;
const escenario3D = () => (estado.version === '3d' && estado.hay3D && sala3D) ? sala3D : null;

function pintarFicha3D(titulo) {
  /* En el escenario CSS la ficha la pinta la pantalla; aquí sólo cuando manda el 3D. */
  const capa = $('capa3d');
  const vivo = escenario3D() ? titulo : null;
  capa.innerHTML = vivo ? fichaGanador(vivo, '3d') : '';
  capa.classList.toggle('viva', !!vivo);
}

/* Un solo puente: lo que la máquina de fases le pide al escenario, se lo
   pide a los dos, y cada uno lo resuelve con sus medios. */
const escena = {
  telon(abierto) {
    escenarioCSS.telon(abierto);
    escenario3D()?.telon(abierto);
  },
  reposo(texto) {
    escenarioCSS.reposo(texto);
    pintarFicha3D(null);
    escenario3D()?.reposo();
  },
  conteo(numero) {
    escenarioCSS.conteo(numero);
    escenario3D()?.conteo(numero);
  },
  montarCarretes(tiras, finalistas) {
    escenarioCSS.montarCarretes(tiras);
    pintarFicha3D(null);
    /* Sin primer acto (duelo o finalista único) los tambores no giran: el
       finalista tiene que estar ya de frente. */
    const quietos = tiras.every((t) => t.length === 1);
    escenario3D()?.montarTambores(finalistas, quietos);
  },
  girarTiras(base, paroJuntos, corto) {
    escenarioCSS.girarTiras(base, paroJuntos, corto);
    escenario3D()?.girarTambores(base, paroJuntos, corto);
  },
  elegido(indice) {
    escenarioCSS.elegido(indice);
    escenario3D()?.elegido(indice);
  },
  ganador(titulo) {
    escenarioCSS.ganador(titulo);
    pintarFicha3D(titulo);
    escenario3D()?.ganador(titulo);
  },
  sello() {
    escenarioCSS.sello();
    escenario3D()?.sello();
  },
  limpiar() {
    escenarioCSS.limpiar();
    pintarFicha3D(null);
    escenario3D()?.limpiar();
  },
};

/* ── Máquina de fases del giro (la misma que `ejecutarGiro`) ─────── */

function fijarFase(fase) {
  estado.fase = fase;
  $('bit-fase').textContent = fase;
  sala3D?.setFase(fase);
  if (tresDPendiente && !estado.ocupado && ['reposo', 'ganador', 'funcion'].includes(fase)) {
    const THREE = tresDPendiente;
    tresDPendiente = null;
    if (reducido()) sinTresD('el aparato pide movimiento reducido');
    else {
      try { arrancarSala3D(THREE); }
      catch { sinTresD('no arrancó la sala 3D'); }
    }
  }
}

function refrescarFoso() {
  const { cuentas, candidatos, saltaPrimerActo } = derivarCartelera(estado.filtro, estado.vetados);
  $('bit-cartelera').textContent = candidatos.length;
  $('bit-giros').textContent = estado.giros;
  [...$('filtros').children].forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.valor === estado.filtro));
    b.textContent = `${FILTROS.find((f) => f.valor === b.dataset.valor).etiqueta} ${cuentas[b.dataset.valor]}`;
    b.disabled = estado.ocupado;
  });
  [...$('mando-version').children].forEach((b) => {
    b.disabled = estado.ocupado || (b.dataset.valor === '3d' && !estado.hay3D);
  });
  document.querySelectorAll('.btn-ver, .btn-veto').forEach((b) => {
    b.disabled = estado.ocupado || (b.classList.contains('btn-veto') && estado.vetados.size >= VETOS_POR_NOCHE);
  });
  const libres = VETOS_POR_NOCHE - estado.vetados.size;
  $('panel-vetos').classList.toggle('agotado', libres === 0);
  [...$('fichas-veto').children].forEach((f, i) => f.classList.toggle('usada', i >= libres));
  $('palanca').disabled = estado.ocupado;
  $('palanca').textContent = estado.fase === 'funcion'
    ? 'Poner otra función'
    : estado.giros ? 'Girar otra vez' : 'Comenzar la función';
  $('anuncio').textContent = candidatos.length === 0
    ? 'No queda nada que girar con este filtro'
    : saltaPrimerActo
      ? (candidatos.length === 1 ? 'Un solo título: el giro es puro trámite' : `Duelo directo entre ${candidatos.length}`)
      : 'Dos actos: primero los finalistas, luego la elección';
  return { candidatos, saltaPrimerActo, cuentas };
}

function textoDeReposo() {
  const { candidatos } = derivarCartelera(estado.filtro, estado.vetados);
  if (estado.fase === 'funcion' && estado.ganador) return `Esta noche · ${estado.ganador.nombre}`;
  return candidatos.length
    ? 'Baja la palanca y que el azar decida'
    : 'Nada que girar · cambia el filtro';
}

async function ejecutarGiro(candidatos, saltaPrimerActo) {
  const id = (secuenciaGiro += 1);
  estado.candidatos = candidatos;
  const corto = reducido();
  const finalistas = elegirFinalistas(candidatos, saltaPrimerActo);
  const primerActo = candidatos.length > 0 && !saltaPrimerActo;
  giroEnVuelo = { id, finalistas };

  estado.ocupado = true;
  estado.ganador = null;
  estado.elegido = null;
  estado.giros += 1;
  refrescarFoso();

  fijarFase('reposo');
  escena.reposo(textoDeReposo());
  escena.telon(false);
  /* La espera de la casa entre cerrar y volver a abrir (`sala-cartelera.tsx`).
     El telón no termina de cerrar en 520 ms —tarda 1.15 s— y no hace falta:
     la curva arranca desde donde va y el cierre parcial se lee como un
     parpadeo del terciopelo, igual que en la app. */
  await esperar(corto ? 20 : 520);
  if (!puedeSeguir(id)) return;

  escena.telon(true);

  if (estado.ajustes.conteo) {
    fijarFase('conteo');
    for (const numero of [3, 2, 1]) {
      estado.numeroConteo = numero;
      escena.conteo(numero);
      await esperar(corto ? 90 : 480);
      if (!puedeSeguir(id)) return;
    }
    escena.conteo(null);
  } else {
    await esperar(corto ? 20 : 520);
    if (!puedeSeguir(id)) return;
  }

  if (candidatos.length === 0) {
    estado.ocupado = false;
    fijarFase('reposo');
    escena.reposo('Vuelta vacía · no hay títulos que girar');
    giroEnVuelo = null;
    refrescarFoso();
    return;
  }

  estado.finalistas = finalistas;
  escena.montarCarretes(
    finalistas.map((f) => (primerActo ? tiraDe(candidatos, f) : [f])),
    finalistas,
  );
  fijarFase(primerActo ? 'girando' : 'finalistas');
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  if (!puedeSeguir(id)) return;
  await esperar(corto ? 20 : 380);
  if (!puedeSeguir(id)) return;

  const base = RITMOS[estado.ajustes.ritmo];
  if (primerActo) {
    const paroJuntos = estado.ajustes.paro === 'juntos';
    escena.girarTiras(base, paroJuntos, corto);
    await esperar(corto ? 60 : base * (paroJuntos ? 1 : 1.9) + 260);
    if (!puedeSeguir(id)) return;
    fijarFase('finalistas');
  }

  /* Acto 2: la luz del proyector salta entre los tambores con esperas
     crecientes y se posa en el ganador. */
  const ganadorIndice = elegirIndiceGanador(finalistas.length);
  if (!corto) {
    const saltos = 9 + ganadorIndice;
    for (let salto = 0; salto <= saltos; salto += 1) {
      const donde = finalistas.length === 1 && salto % 2 === 1 ? null : salto % finalistas.length;
      estado.elegido = donde;
      escena.elegido(donde);
      await esperar((110 + salto * 42) * (base / RITMOS.dramatico));
      if (!puedeSeguir(id)) return;
    }
  }
  estado.elegido = ganadorIndice;
  escena.elegido(ganadorIndice);
  await esperar(corto ? 40 : 700);
  if (!puedeSeguir(id)) return;

  giroEnVuelo = null;
  estado.ganador = finalistas[ganadorIndice];
  estado.ocupado = false;
  fijarFase('ganador');
  escena.ganador(estado.ganador);
  refrescarFoso();
  $('aviso').textContent = `Ganó ${estado.ganador.nombre}.`;
}

function girar() {
  if (estado.ocupado) return;
  const { candidatos, saltaPrimerActo } = derivarCartelera(estado.filtro, estado.vetados);
  void ejecutarGiro(candidatos, saltaPrimerActo);
}

async function vetar() {
  if (estado.ocupado || !estado.ganador) return;
  if (estado.vetados.size >= VETOS_POR_NOCHE) return;
  const vetada = estado.ganador;
  const id = (secuenciaGiro += 1);
  estado.ocupado = true;
  fijarFase('vetando');
  refrescarFoso();
  escena.sello();
  await esperar(reducido() ? 40 : 820);
  if (!puedeSeguir(id)) return;
  estado.vetados.add(vetada.id);
  estado.ganador = null;
  estado.ocupado = false;
  $('aviso').textContent = `Vetada ${vetada.nombre}. Sale de la cartelera de la noche.`;
  refrescarFoso();
  const { candidatos, saltaPrimerActo } = derivarCartelera(estado.filtro, estado.vetados);
  void ejecutarGiro(candidatos, saltaPrimerActo);
}

function ponerFuncion() {
  if (estado.ocupado || !estado.ganador) return;
  secuenciaGiro += 1;
  giroEnVuelo = null;
  fijarFase('funcion');
  escena.limpiar();
  escena.telon(false);
  escenarioCSS.reposo(`Esta noche · ${estado.ganador.nombre}`);
  $('aviso').textContent = `Eligieron ${estado.ganador.nombre}.`;
  estado.ocupado = false;
  refrescarFoso();
}

/* ── Focos de la marquesina: reposo 620 · girando 110 · fiesta 240 ── */

let pasoFocos = 0;
let relojFocos = null;

function modoDeFocos() {
  if (estado.fase === 'ganador' || estado.fase === 'funcion') return 'fiesta';
  return estado.ocupado ? 'girando' : 'reposo';
}

function armarFocos() {
  const modo = modoDeFocos();
  if (relojFocos) clearInterval(relojFocos.id);
  if (reducido()) {
    document.querySelectorAll('.foco').forEach((l) => l.classList.add('on'));
    sala3D?.focos(0, 'todo');
    relojFocos = null;
    return;
  }
  const ms = modo === 'fiesta' ? 240 : modo === 'girando' ? 110 : 620;
  const tic = () => {
    escenarioCSS.focos(pasoFocos, modo);
    sala3D?.focos(pasoFocos, modo);
    document.documentElement.style.setProperty(
      '--brillo-firma', (0.34 + 0.42 * (pasoFocos % 2)).toFixed(2));
    pasoFocos += 1;
  };
  tic();
  relojFocos = { modo, id: setInterval(tic, ms) };
}

/* El modo cambia con la fase; sólo se rearma cuando de verdad cambió. */
function vigilarFocos() {
  const modo = modoDeFocos();
  if (!relojFocos || relojFocos.modo !== modo) armarFocos();
}

/* ── Cabina del prototipo ────────────────────────────────────────── */

function mando(contenedor, opciones, leer, escribir) {
  const el = $(contenedor);
  el.innerHTML = opciones.map((o) =>
    `<button class="opcion" type="button" data-valor="${o.valor}">${o.etiqueta}</button>`).join('');
  const pintar = () => [...el.children].forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.valor === String(leer()))));
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b || b.disabled) return;
    escribir(b.dataset.valor);
    pintar();
  });
  pintar();
  return pintar;
}

mando('mando-ritmo', [
  { valor: 'rapido', etiqueta: 'Rápido' },
  { valor: 'normal', etiqueta: 'Normal' },
  { valor: 'dramatico', etiqueta: 'Dramático' },
], () => estado.ajustes.ritmo, (v) => { estado.ajustes.ritmo = v; });

mando('mando-paro', [
  { valor: 'uno', etiqueta: 'Uno por uno' },
  { valor: 'juntos', etiqueta: 'Juntos' },
], () => estado.ajustes.paro, (v) => { estado.ajustes.paro = v; });

mando('mando-conteo', [
  { valor: 'true', etiqueta: 'Con conteo' },
  { valor: 'false', etiqueta: 'Sin conteo' },
], () => estado.ajustes.conteo, (v) => { estado.ajustes.conteo = v === 'true'; });

const pintarVersion = mando('mando-version', [
  { valor: '3d', etiqueta: '3D' },
  { valor: 'css', etiqueta: 'CSS de hoy' },
], () => estado.version, (v) => {
  if (estado.ocupado || (v === '3d' && !estado.hay3D)) return;
  estado.version = v;
  aplicarVersion();
});

function aplicarVersion() {
  const tresD = estado.version === '3d' && estado.hay3D;
  const saliendo = tableroEl.classList.contains('tresd') && !tresD;
  if (saliendo && estado.ocupado) escenarioCSS.terminarTiras();
  tableroEl.classList.toggle('tresd', tresD);
  sala3D?.encender(tresD);
  if (tresD) {
    /* Al volver a 3D la escena se pone al día con la fase que ya corre. */
    sala3D.telon(escenarioEl.classList.contains('abierto'));
    sala3D.setFase(estado.fase);
    if (estado.fase === 'ganador' && estado.ganador) sala3D.ganador(estado.ganador);
    pintarFicha3D(estado.fase === 'ganador' ? estado.ganador : null);
  } else {
    pintarFicha3D(null);
    escenarioCSS.centrarConteo();
  }
  $('nota-cabina').textContent = estado.hay3D
    ? (tresD
      ? 'Escenario en tres dimensiones · un solo contexto WebGL, 20 cuadros por segundo en reposo'
      : 'Escenario CSS de hoy · el 3D queda apagado, sin cuadros')
    : `Sin escenario 3D: ${estado.motivoSinTresD}. Manda la versión CSS de hoy.`;
  [...$('mando-version').children].forEach((b) => {
    b.disabled = estado.ocupado || (b.dataset.valor === '3d' && !estado.hay3D);
  });
  pintarVersion();
}

function sinTresD(motivo) {
  tresDPendiente = null;
  estado.hay3D = false;
  estado.motivoSinTresD = motivo;
  estado.version = 'css';
  aplicarVersion();
  pintarVersion();
}

['focos-arriba', 'focos-abajo'].forEach((id) => {

});

$('filtros').innerHTML = FILTROS.map((f) =>

escenarioCSS.reposo('Baja la palanca y que el azar decida');
refrescarFoso();
armarFocos();
setInterval(vigilarFocos, 200);
$('nota-cabina').textContent = 'Sala CSS pintada · llamando al escenario en tres dimensiones…';

/* ═══════════════════════════════════════════════════════════════════════
   El escenario en tres dimensiones
   three.js llega tarde y a propósito: la sala CSS ya está pintada cuando
   este import arranca, y si falla —o no hay WebGL, o el aparato pide
   movimiento reducido— la sala CSS se queda y nadie se entera.
   ═══════════════════════════════════════════════════════════════════════ */

function hayWebGL() {
  let c = null, gl = null;
  try {
    c = document.createElement('canvas');
    gl = c.getContext('webgl2') || c.getContext('webgl');
    const disponible = !!gl;
    gl?.getExtension('WEBGL_lose_context')?.loseContext();
    return disponible;
  } catch { return false; }
  finally { gl = null; c = null; }
}

movimientoReducido.addEventListener('change', (evento) => {
  if (evento.matches && (estado.hay3D || tresDPendiente)) {
    sinTresD('el aparato pide movimiento reducido');
  }
});

if (reducido()) {
  sinTresD('el aparato pide movimiento reducido');
} else if (!hayWebGL()) {
  sinTresD('este navegador no da WebGL');
} else {
  try {
    const THREE = await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.185.1/three.module.min.js');
    if (reducido()) sinTresD('el aparato pide movimiento reducido');
    else if (estado.ocupado) tresDPendiente = THREE;
    else arrancarSala3D(THREE);
  } catch (error) {
    console.warn('El cine · no cargó three.js:', error);
    sinTresD('no cargó three.js');
  }
}

function arrancarSala3D(THREE) {
  /* Sin gestión de color: la paleta de la casa está escrita en sRGB y debe
     llegar al píxel tal cual, para que el comparador enfrente los mismos
     vinos y el mismo latón en las dos versiones. */
  THREE.ColorManagement.enabled = false;

  const col = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
  };

  const TERCIOPELO = { oscuro: col('#3c0c1a'), medio: col('#6b1a2e'), claro: col('#8e2438') };
  const LATON = col('#c9a227');
  const LATON_TENUE = col('#8a6f1c');
  const CREMA = col('#f2e5c6');

  /* Medidas de la sala, en unidades de escena. Ocho pósters dan la vuelta a
     cada tambor: el arco de enfrente enseña uno entero y los vecinos se
     curvan hacia la sombra, como el vidrio del carrete. */
  const CELDAS = 8;
  const POSTER_ALTO = 1.92;
  const POSTER_ANCHO = 1.28;
  const RADIO = (POSTER_ALTO * CELDAS) / (Math.PI * 2);
  const ALTO_VISTA = 6.0;
  const ANCHO_MINIMO = 4.6;
  const FOV = 34;
  const TOPE = (3 * Math.PI) / 180;
  /* El telón recogido se come el 11 % del ancho por lado, así que el arco
     libre mide el 78 % del escenario. El trío se junta un 8 % y se achica un
     6 % —el margen que da el encargo— para que los rótulos de los pósters
     exteriores queden enteros dentro del arco; los cantos de esos pósters sí
     pasan por detrás de la tela, y eso lee como proscenio. */
  const SEPARACION = (POSTER_ANCHO + 0.16) * 0.92;
  const ESCALA_TAMBOR = 0.94;

  /* ── Texturas de lienzo ────────────────────────────────────────── */

  function texturaDe(lienzo, repetir) {
    const t = new THREE.CanvasTexture(lienzo);
    t.colorSpace = THREE.LinearSRGBColorSpace;
    t.wrapS = repetir ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
    t.wrapT = THREE.ClampToEdgeWrapping;
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    t.anisotropy = 1;
    return t;
  }

  function lienzoRadial(paradas, lado = 128) {
    const c = document.createElement('canvas');
    c.width = c.height = lado;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(lado / 2, lado / 2, 0, lado / 2, lado / 2, lado / 2);
    paradas.forEach(([p, color]) => g.addColorStop(p, color));
    x.fillStyle = g;
    x.fillRect(0, 0, lado, lado);
    return c;
  }

  const TEX_HALO = texturaDe(lienzoRadial([
    [0, 'rgba(255,233,168,1)'], [0.28, 'rgba(255,214,120,0.55)'],
    [0.62, 'rgba(201,162,39,0.16)'], [1, 'rgba(201,162,39,0)'],
  ]));

  const TEX_POLVO = texturaDe(lienzoRadial([
    [0, 'rgba(242,229,198,1)'], [0.45, 'rgba(242,229,198,0.35)'], [1, 'rgba(242,229,198,0)'],
  ], 32));

  /* La tira del tambor: los pósters van acostados porque el eje del cilindro
     es horizontal —lo alto del póster da la vuelta, lo ancho corre por el
     eje—, así que cada uno entra girado un cuarto de vuelta. */
  function lienzoTira(titulos) {
    const celdaAncho = 384, celdaAlto = 256;
    const c = document.createElement('canvas');
    c.width = celdaAncho * CELDAS;
    c.height = celdaAlto;
    const x = c.getContext('2d');
    x.fillStyle = '#050204';
    x.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < CELDAS; i += 1) {
      const t = titulos[i % titulos.length];
      x.save();
      x.translate(i * celdaAncho + celdaAncho, 0);
      x.rotate(Math.PI / 2);
      pintarPoster(x, t, celdaAlto, celdaAncho, true);
      x.restore();
    }
    return c;
  }

  /* Huella del frustum en los planos extremos de la tela, con la misma
     órbita y lookAt del render. Se incluyen los cuatro ángulos combinados.
     El dedo adicional de encuadrar queda fuera de esta envolvente. */
  function envolventeTelon(proporcion, distancia, zMin, zMax) {
    const normalizar = (v) => { const l = Math.hypot(...v); return v.map((n) => n / l); };
    const cruz = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const tangente = Math.tan(FOV * Math.PI / 360);
    let x = 0, y = 0;
    for (const ax of [-TOPE, 0, TOPE]) for (const ay of [-TOPE, 0, TOPE]) {
      const c = [Math.sin(ax) * distancia, Math.sin(ay) * distancia, Math.cos(ax) * Math.cos(ay) * distancia];
      const n = normalizar(c), derecha = normalizar(cruz([0, 1, 0], n)), arriba = cruz(n, derecha);
      for (const z of [zMin, zMax]) for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
        const r = n.map((v, i) => -v + tangente * (sx * proporcion * derecha[i] + sy * arriba[i]));
        const t = (z - c[2]) / r[2];
        x = Math.max(x, Math.abs(c[0] + t * r[0]));
        y = Math.max(y, Math.abs(c[1] + t * r[1]));
      }
    }
    return { x, y };
  }

  /* ── crearTelon ────────────────────────────────────────────────────
     Frontera R3F: <Telon abierto={bool} encuadre={medioAncho} /> — dos paños
     de terciopelo, una cenefa fruncida con festones y ribete de latón, y un
     alzapaño de latón por lado.

     La regla del módulo: los paños NUNCA se esconden. «Abierto» no es «no
     hay tela», es «la tela está recogida a los lados con su alzapaño», que
     es lo que enseña la referencia del dueño: el hueco queda dibujado como
     un arco entre dos paños que siguen colgando a toda altura. `recogida`
     (0 cerrado → 1 abierto) sigue siendo el único parámetro y sigue viajando
     con `CURVA_TELON` en 1.15 s. */
  function crearTelon(grupo) {
    /* Medidas de referencia: sólo crecen si la caja pide más cobertura.
       El ancho cerrado se deriva del borde para conservar 0.10 de cruce. */
    const ANCHO = 2.41, ALTO = 5.4, Z = 1.6;
    const CENEFA_ANCHO = 4.9, CENEFA_ALTO = 1.3;
    const BORDE = 2.36, H_ALZA = 0.48;
    const ALTO_IPHONE = Math.max(ALTO_VISTA, ANCHO_MINIMO / (366 / 490));
    const DISTANCIA_IPHONE = ALTO_IPHONE / 2 / Math.tan(FOV * Math.PI / 360);
    const MEDIO_ALTO_IPHONE = ALTO_IPHONE / 2 * (DISTANCIA_IPHONE - Z) / DISTANCIA_IPHONE;
    let Y_ALZA = 0;
    /* 0.105 y no 0.11: medido sobre el píxel, la cintura de 0.11 dejaba el
       hueco en el 77.7 % y el encargo pide ≥ 78 %. Este medio punto lo pone
       en el 79 % con margen, y a ojo es la misma cintura. */
    const F_CINTURA = 0.105;         // la cintura del paño, en fracción de W
    const PLIEGUES = 11;

    const uniformes = {
      recogida: { value: 0 },
      /* Medio ancho del escenario que se ve en el plano del paño. Lo pone
         `encuadrar` desde `medir`: la silueta está escrita en fracciones del
         ancho del escenario W, así que el módulo necesita saber cuánto se ve
         para que la cintura mida 0.11·W y el hueco quede en el 78 % de W. */
      encuadre: { value: 1.95 },
      borde: { value: BORDE },
      ancho: { value: ANCHO },
      medioAlto: { value: ALTO / 2 },
      suelo: { value: -MEDIO_ALTO_IPHONE },
      cenefa: { value: 1.701 },
    };

    const vertice = `
      uniform float uRecogida;
      uniform float uLado;
      uniform float uPliegues;
      uniform float uAncho;
      uniform float uEncuadre;
      uniform float uBorde;
      uniform float uMedioAlto;
      uniform float uSuelo;
      uniform float uCenefa;
      varying vec2 vUv;
      varying vec3 vV;
      varying vec3 vBx;
      varying vec3 vBz;
      varying float vS;
      varying float vGrad;
      varying float vPaso;
      varying float vH;

      const float H_ALZA = 0.48;
      const float F_ARRIBA = 0.30;
      const float F_CINTURA = 0.105;
      const float F_SUELO = 0.16;

      /* ── La silueta del paño recogido ────────────────────────────────
         Devuelve el ancho VISIBLE del paño en fracción del ancho del
         escenario W, contado desde el canto exterior del escenario, para una
         altura h del hueco (h = 1 bajo la cenefa, h = 0 en el suelo):

           h = 1        0.30·W   la tela sube ancha hasta el fruncido
           h = H_ALZA   0.11·W   la CINTURA que ciñe el alzapaño; el hueco
                                 entre los dos paños queda en el 78 % de W
           h = 0        0.16·W   el ABANICO del dobladillo, asentado al suelo

         Arriba de la cintura el borde interior dibuja el SWAG: casi una
         diagonal, con la potencia 1.45 que la hace salir plana de la cintura
         —ahí la tela está estrangulada— y abrirse de golpe al llegar a la
         cenefa. Es la curva medida sobre la referencia: a media altura del
         swag el borde ha recorrido el 37 % del camino, no el 50 %.

         Abajo la tela vuelve a abrirse en ABANICO, casi recto y con un punto
         de vuelo al final (el 0.80/0.20), que es como cae el dobladillo.

         El hueco resultante es un arco: cerrado arriba —donde la cenefa tapa
         de todos modos—, máximo a la altura del alzapaño y algo más cerrado
         en el suelo. */
      float silueta(float h) {
        float a = clamp((h - H_ALZA) / (1.0 - H_ALZA), 0.0, 1.0);
        float b = clamp((H_ALZA - h) / H_ALZA, 0.0, 1.0);
        float swag = mix(F_CINTURA, F_ARRIBA, pow(a, 1.45));
        float abanico = mix(F_CINTURA, F_SUELO, b * (0.80 + 0.20 * b));
        return h >= H_ALZA ? swag : abanico;
      }

      void main() {
        vUv = uv;
        vec3 p = position;
        /* «s» corre por la tela: 0 en el borde exterior, 1 en el interior.
           Silueta y pliegues se escriben en «s», que es coordenada material:
           así los pliegues viajan con el paño y se aprietan cuando se recoge,
           en vez de deslizarse por debajo de la tela. */
        float s = uLado < 0.0 ? uv.x : 1.0 - uv.x;
        vS = s;
        p.y = (uv.y - 0.5) * 2.0 * uMedioAlto;
        float h = clamp((p.y - uSuelo) / (uCenefa - uSuelo), 0.0, 1.0);

        /* Ancho del paño a esta altura. Cerrado es la cortina recta de
           siempre (uAncho); abierto, la silueta. «sobra» es lo que la tela
           se sale del canto del escenario: se suma para que lo VISIBLE mida
           exactamente lo que pide la silueta. Un solo «mix»: ni salto ni
           cambio de topología entre los dos estados. */
        float W = 2.0 * uEncuadre;
        float sobra = max(uBorde - uEncuadre, 0.0);
        float w = mix(uAncho, silueta(h) * W + sobra, uRecogida);
        p.x = uLado * (uBorde - s * w);

        /* Los pliegues, con la amplitud atada al apretón: el paño recogido
           está seis veces más junto y sus pliegues son más hondos. Tope
           0.168 de onda + 0.030 de barriga = z 1.798, que respeta el margen
           contra la cenefa (1.848 en su valle más adelantado). */
        float aprieto = clamp(uAncho / max(w, 0.15), 1.0, 4.2);
        float fase = s * uPliegues * 6.2831853;
        float amp = min(0.052 * (0.30 + 0.70 * aprieto), 0.168);
        p.z += sin(fase) * amp + 0.030 * uRecogida * sin(3.14159265 * s);
        vH = h;                       // el fragmento la usa para el fruncido de la cintura

        /* La cresta se ilumina por píxel, no por vértice: al fragmento le
           bastan la pendiente de la onda («vGrad»), el paso del pliegue
           («vPaso», para saber cuánta cresta cabe) y la base de la normal
           llevada a vista. */
        /* Con tope: el paño recogido aprieta tanto el pliegue que sin él la
           cresta se pone de canto (84°) y la tela se lee como lámina
           acanalada en vez de terciopelo. */
        vGrad = min(amp * uPliegues * 6.2831853 / max(w, 0.15), 3.2);
        vPaso = w / uPliegues;
        vBx = normalMatrix * vec3(uLado, 0.0, 0.0);
        vBz = normalMatrix * vec3(0.0, 0.0, 1.0);

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        vV = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`;

    const cabecera = `
      uniform vec3 uOscuro;
      uniform vec3 uMedio;
      uniform vec3 uClaro;
      uniform float uLado;
      uniform float uRecogida;
      uniform float uPliegues;
      uniform float uAncho;
      varying vec2 vUv;
      varying vec3 vV;
      varying vec3 vBx;
      varying vec3 vBz;
      varying float vS;
      varying float vGrad;
      varying float vPaso;
      varying float vH;
      `;

    /* El terciopelo, común a paños y cenefa: crestas claras, valles hondos y
       un satén estrecho encima. Más contraste que la tira lisa de antes —la
       referencia enseña la tela acanalada— sin salirse del vino de la casa. */
    const tela = `
      vec3 terciopelo(out float f, out float ndv) {
        float fase = vS * uPliegues * 6.2831853;
        /* Familias de pliegues: la tela no se frunce con regla. Una onda
           lenta encima de la del pliegue hace que unas crestas salgan más
           que otras, que es lo que separa el terciopelo del peine. */
        float familia = 0.70 + 0.30 * sin(vS * 5.3 + 1.7);
        f = sin(fase) * 0.5 + 0.5;
        vec3 n = normalize(vBx * (cos(fase) * vGrad * familia) + vBz);
        ndv = clamp(dot(n, normalize(vV)), 0.0, 1.0);
        /* La sala alumbra desde delante y un poco por la izquierda alta: el
           claro no cae en la cresta sino en su ladera, y por eso la tela
           parece tela. Luz fija en espacio de vista, como el latón. */
        float ndl = clamp(dot(n, normalize(vec3(-0.36, 0.34, 0.87))), 0.0, 1.0);
        float g = pow(clamp(0.32 * f + 0.74 * ndl, 0.0, 1.0), 1.30);
        vec3 c = mix(uOscuro * 0.62, uMedio, smoothstep(0.02, 0.60, g));
        c = mix(c, uClaro, smoothstep(0.64, 1.0, g));
        /* El pelo del terciopelo se oscurece al sesgo, no se aclara. */
        c *= mix(1.0, 0.72, pow(1.0 - ndv, 2.6));
        /* El satén se ensancha cuando el paso del pliegue se estrecha: el
           terciopelo apretado no resuelve una cresta de un píxel y, de paso,
           así el brillo no titila al girar el aparato. */
        float finura = smoothstep(0.045, 0.17, vPaso);
        c += vec3(1.0, 0.90, 0.82) * pow(ndl, mix(10.0, 30.0, finura)) * (0.12 + 0.26 * ndv) * familia;
        return c;
      }`;

    const fragmento = cabecera + tela + `
      const float H_ALZA = 0.48;
      void main() {
        float f, ndv;
        vec3 c = terciopelo(f, ndv) * 0.86;
        /* Cuanto más apretado el paño, más honda la sombra entre pliegues. */
        float aprieto = clamp(uAncho / max(vPaso * uPliegues, 0.15), 1.0, 4.2);
        c *= mix(1.0, 0.84, clamp((aprieto - 1.0) / 3.2, 0.0, 1.0));
        /* El apretón de la cuerda, resuelto en el fragmento y no en la
           geometría: el paño ya está contra su tope de onda (0.168) y un
           milímetro más de pliegue se comería el margen contra la cenefa.
           Dos cosas en una banda estrecha alrededor de la cintura: el valle
           se hunde y la cresta se aviva —eso es el fruncido— y, medio dedo
           por debajo, la sombra que la cuerda tira sobre la tela. Sólo con
           el telón recogido, que es cuando hay alzapaño. */
        float dCintura = vH - H_ALZA;
        float banda = exp(-dCintura * dCintura * 170.0) * uRecogida;
        c *= mix(1.0, 0.55 + 0.70 * f * f, banda * 0.80);
        float bajo = clamp(-dCintura / 0.085, 0.0, 1.0);
        c *= mix(1.0, 0.60, exp(-dCintura * dCintura * 240.0) * uRecogida * (0.35 + 0.65 * bajo));
        c *= mix(0.38, 1.0, (1.0 - smoothstep(0.86, 1.0, vUv.y)));   // la sombra de la cenefa
        c *= mix(1.0, 0.62, (1.0 - smoothstep(0.0, 0.22, vUv.y)));   // sombras al foso
        /* Cerrado, el borde interior es la costura del centro y se hunde;
           recogido es el filo libre del swag y recoge luz. */
        c *= mix(1.0, 0.40, smoothstep(0.90, 1.0, vS) * (1.0 - 0.62 * uRecogida));
        c += uClaro * smoothstep(0.962, 1.0, vS) * uRecogida * 0.30;
        gl_FragColor = vec4(c, 1.0);
      }`;

    [-1, 1].forEach((lado) => {
      const malla = new THREE.Mesh(
        new THREE.PlaneGeometry(ANCHO, ALTO, 96, 128),
        new THREE.ShaderMaterial({
          uniforms: {
            uRecogida: uniformes.recogida,
            uEncuadre: uniformes.encuadre,
            uLado: { value: lado },
            uPliegues: { value: PLIEGUES },
            uAncho: uniformes.ancho,
            uBorde: uniformes.borde,
            uMedioAlto: uniformes.medioAlto,
            uSuelo: uniformes.suelo,
            uCenefa: uniformes.cenefa,
            uOscuro: { value: TERCIOPELO.oscuro },
            uMedio: { value: TERCIOPELO.medio },
            uClaro: { value: TERCIOPELO.claro },
          },
          vertexShader: vertice,
          fragmentShader: fragmento,
          side: THREE.DoubleSide,
        }),
      );
      malla.position.set(0, 0, Z);
      // La envolvente del shader supera la caja de la geometría base.
      malla.frustumCulled = false;
      grupo.add(malla);
    });

    /* Cenefa: la misma tela, con el fruncido más denso (22 pliegues sobre
       4.9 en vez de 16 sobre 4.6), el borde recortado en nueve festones más
       profundos y regulares, y un ribete de latón cosido al canto. */
    const cenefa = new THREE.Mesh(
      new THREE.PlaneGeometry(CENEFA_ANCHO, CENEFA_ALTO, 128, 2),
      new THREE.ShaderMaterial({
        uniforms: {
          uRecogida: { value: 0 },
          uEncuadre: uniformes.encuadre,
          uLado: { value: -1 },
          uPliegues: { value: 22 },
          uAncho: { value: CENEFA_ANCHO },
          uBorde: { value: CENEFA_ANCHO / 2 },
          uMedioAlto: { value: CENEFA_ALTO / 2 },
          uSuelo: uniformes.suelo,
          uCenefa: uniformes.cenefa,
          uOscuro: { value: TERCIOPELO.oscuro },
          uMedio: { value: TERCIOPELO.medio },
          uClaro: { value: TERCIOPELO.claro },
          uLaton: { value: LATON },
        },
        vertexShader: vertice,
        fragmentShader: cabecera + `uniform vec3 uLaton;` + tela + `
          void main() {
            float feston = 0.54 - 0.44 * pow(abs(sin(vUv.x * 3.14159265 * 9.0)), 0.60);
            float d = vUv.y - feston;
            if (d < 0.0) discard;
            float f, ndv;
            vec3 c = terciopelo(f, ndv) * 0.90;
            c *= mix(0.58, 1.0, smoothstep(0.0, 0.20, d));   // el canto del festón, a sombra
            float ribete = 1.0 - smoothstep(0.005, 0.022, d);
            c = mix(c, uLaton * (0.50 + 0.90 * pow(f, 1.6)), ribete * 0.92);
            gl_FragColor = vec4(c, 1.0);
          }`,
        side: THREE.DoubleSide,
      }),
    );
    /* Z mínimo 1.848 > 1.798 de los paños; el faldón más hondo conserva la
       cobertura al adelantarlo, incluso con el parallax de ±3°. */
    cenefa.position.set(0, 2.1, 1.9);
    cenefa.frustumCulled = false;
    grupo.add(cenefa);

    /* ── Alzapaño ──────────────────────────────────────────────────────
       La cuerda dorada que CIÑE cada paño por la cintura, con su borla. No
       es un aro pegado delante de la tela: la curva tiene fondo. El tramo
       frontal pasa por z 1.855 —delante de la cresta más alta del paño,
       1.798— y los dos extremos se hunden hasta 1.375, detrás del valle más
       hondo (1.432), así que la prueba de profundidad esconde media vuelta
       DETRÁS del paño y la cuerda se lee rodeándolo. Aparece en el último
       30 % de la apertura —opacidad y escala— y se va al cerrar. Sin luces
       en la escena, como el marco del ganador: difusa y especular contra una
       luz fija en espacio de vista, para que el brillo corra por la torzal
       al ladear el aparato. */
    const Z_CINTURA = 1.615;      // el plano medio del paño: la cuerda lo cruza
    const R_CUERDA = 0.052;       // cuerda, no alambre (antes 0.026)
    const FONDO_CUERDA = 0.24;    // cuánto se hunde por detrás de la tela
    const opacidadAlza = { value: 0 };

    const vertAlza = `
      varying vec2 vUv; varying vec3 vN; varying vec3 vP;
      void main() {
        vUv = uv;
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vP = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`;

    /* El latón de la casa, común a los tres materiales del alzapaño:
       difusa + especular contra la luz fija en espacio de vista. «relieve»
       es el bombeo de la hebra —1 en el lomo del cabo, 0 en el surco—: el
       surco se traga la luz y el lomo se la queda, que es lo que separa una
       cuerda torcida de un tubo liso. */
    const latonAlza = `
      uniform vec3 uLaton; uniform vec3 uTenue; uniform vec3 uCrema;
      uniform float uOpacidad;
      varying vec2 vUv; varying vec3 vN; varying vec3 vP;
      vec3 metal(float relieve, float ancho) {
        vec3 n = normalize(vN);
        vec3 v = normalize(-vP);
        vec3 luz = normalize(vec3(-0.28, 0.62, 0.78));
        float dif = clamp(dot(n, luz), 0.0, 1.0);
        float refl = clamp(dot(reflect(-luz, n), v), 0.0, 1.0);
        float esp = pow(refl, ancho);
        /* El lóbulo ancho impide que el latón se apague en la mitad que no
           mira a la luz: sin él la cuerda se lee marrón oliva en vez de
           dorada. Es el mismo «halo» del marco del ganador. */
        float halo = pow(refl, 7.0);
        float filo = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 2.2);
        float hebra = 0.52 + 0.48 * relieve;
        return mix(uTenue, uLaton, 0.32 + 0.68 * dif) * (0.42 + 0.80 * dif) * hebra
             + uCrema * esp * (0.18 + 0.82 * relieve * relieve) * 0.95
             + uLaton * halo * 0.26 * (0.15 + 0.85 * relieve * relieve)
             + uLaton * filo * 0.35 * hebra;
      }`;

    const unifAlza = () => ({
      uLaton: { value: LATON },
      uTenue: { value: LATON_TENUE },
      uCrema: { value: CREMA },
      uOpacidad: opacidadAlza,
    });

    /* El nudo y la cabeza de la borla: latón liso, sin torzal. */
    const matLaton = new THREE.ShaderMaterial({
      uniforms: unifAlza(),
      vertexShader: vertAlza,
      fragmentShader: latonAlza + `
        void main() { gl_FragColor = vec4(metal(1.0, 34.0), uOpacidad); }`,
      transparent: true,
      depthWrite: true,
    });

    /* La cuerda: tres cabos que dan uTorsion vueltas de un extremo al otro.
       En el TubeGeometry uv.x corre a lo largo del tubo y uv.y da la vuelta,
       así que la fase del cabo es uv.y * 3 − uv.x * uTorsion: estrías
       helicoidales de verdad, sin textura ninguna. */
    const matCuerda = new THREE.ShaderMaterial({
      uniforms: Object.assign(unifAlza(), { uTorsion: { value: 13 } }),
      vertexShader: vertAlza,
      fragmentShader: latonAlza + `
        uniform float uTorsion;
        void main() {
          float cabo = fract(vUv.y * 3.0 - vUv.x * uTorsion);
          float s = abs(cabo - 0.5) * 2.0;
          float relieve = 0.5 + 0.5 * cos(3.14159265 * s);
          gl_FragColor = vec4(metal(relieve, 30.0), uOpacidad);
        }`,
      transparent: true,
      depthWrite: true,
    });

    /* La falda de la borla. El cono nace unitario y el vértice le da el
       perfil —cuello estrecho arriba, cuerpo y vuelo en el dobladillo—
       reconstruyendo el punto desde uv: el ángulo en uv.x, la altura en
       uv.y (0 abajo, 1 arriba). Así el perfil se cambia sin tocar la
       geometría y la borla cuelga de y = 0 hacia abajo. */
    const matFalda = new THREE.ShaderMaterial({
      uniforms: Object.assign(unifAlza(), {
        uAlto: { value: 0.28 }, uRadio: { value: 0.118 }, uHilos: { value: 30 },
      }),
      vertexShader: `
        uniform float uAlto; uniform float uRadio;
        varying vec2 vUv; varying vec3 vN; varying vec3 vP;
        float perfil(float v) {
          float t = 1.0 - clamp(v, 0.0, 1.0);
          float cuerpo = mix(0.34, 1.0, pow(t, 0.62));
          float vuelo = 0.15 * exp(-(1.0 - t) * (1.0 - t) * 44.0);
          return uRadio * (cuerpo + vuelo);
        }
        void main() {
          vUv = uv;
          float th = uv.x * 6.2831853;
          float r = perfil(uv.y);
          float dr = (perfil(uv.y + 0.02) - perfil(uv.y - 0.02)) / (0.04 * uAlto);
          vec3 p = vec3(sin(th) * r, (uv.y - 1.0) * uAlto, cos(th) * r);
          vN = normalize(normalMatrix * normalize(vec3(sin(th), -dr, cos(th))));
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          vP = mv.xyz;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: latonAlza + `
        uniform float uHilos;
        void main() {
          float hilo = vUv.x * uHilos;
          float k = floor(hilo);
          /* Cada fleco se corta a su aire: el dobladillo de una borla no es
             recto. La rifa es la de siempre, sin textura. */
          float recorte = 0.11 * fract(sin(k * 91.37) * 43758.5453);
          if (vUv.y < recorte) discard;
          float s = abs(fract(hilo) - 0.5) * 2.0;
          float relieve = 0.5 + 0.5 * cos(3.14159265 * s);
          vec3 c = metal(relieve, 24.0);
          c *= mix(0.64, 1.0, smoothstep(0.0, 0.62, vUv.y));
          gl_FragColor = vec4(c, uOpacidad);
        }`,
      transparent: true,
      depthWrite: true,
    });

    /* La curva de la cintura: una elipse que además VIAJA en z. «u» es el
       seno del ángulo: el arco de delante (u > 0) baja y se adelanta hasta
       FONDO_CUERDA, el de detrás (u < 0) sube y se hunde otro tanto, y los
       dos extremos (u = 0) pasan justo por el plano de la tela, que es
       donde la cuerda rodea el canto del paño. El exponente 0.72 aplana la
       ida y la vuelta: la cuerda se queda delante en los dos tercios
       centrales y se hunde de golpe cerca de los extremos.
       El signo de «lado» pone el ángulo 0 —donde va el nudo— del lado del
       hueco en los dos paños. 72 × 8 segmentos = 1152 triángulos. */
    function curvaCintura(lado, rx, ry, rz) {
      const puntos = [];
      const N = 32;
      for (let i = 0; i < N; i += 1) {
        const a = (i / N) * Math.PI * 2;
        const u = Math.sin(a);
        const fondo = (u < 0 ? -1 : 1) * Math.pow(Math.abs(u), 0.72);
        puntos.push(new THREE.Vector3(-lado * Math.cos(a) * rx, -u * ry, fondo * rz));
      }
      const curva = new THREE.CatmullRomCurve3(puntos, true, 'catmullrom', 0.5);
      /* El largo de la poligonal, para repartir el torzal a paso constante
         sin pedirle a la curva que se mida (y sin depender de three). */
      let largo = 0;
      for (let i = 0; i < N; i += 1) {
        const p = puntos[i], q = puntos[(i + 1) % N];
        largo += Math.hypot(q.x - p.x, q.y - p.y, q.z - p.z);
      }
      curva.largo = largo;
      return curva;
    }

    /* El cordón corto del que cuelga la borla, del nudo hacia el hueco. */
    function curvaColgante() {
      return new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.01, 0),
        new THREE.Vector3(0.004, -0.035, 0.006),
        new THREE.Vector3(0.002, -0.075, 0.009),
        new THREE.Vector3(0, -0.112, 0.010),
      ], false, 'catmullrom', 0.5);
    }

    const A_NUDO = 0.38 * Math.PI;   // el nudo, en el arco de delante y del lado del hueco

    const alzapanos = [-1, 1].map((lado) => {
      const raiz = new THREE.Group();
      raiz.position.set(0, Y_ALZA, Z_CINTURA);
      raiz.rotation.z = lado * 0.16;      // la cuerda cae un punto hacia el hueco
      raiz.visible = false;
      raiz.renderOrder = 6;
      const cuerda = new THREE.Mesh(
        new THREE.TubeGeometry(curvaCintura(lado, 0.3, 0.1, FONDO_CUERDA), 72, R_CUERDA, 8, true),
        matCuerda,
      );
      const nudo = new THREE.Mesh(new THREE.SphereGeometry(0.062, 14, 10), matLaton);
      nudo.scale.set(1, 0.80, 0.92);
      /* La borla cuelga del nudo y se balancea sola: ±2.6° cada 2.6 s. */
      const borla = new THREE.Group();
      const colgante = new THREE.Mesh(
        new THREE.TubeGeometry(curvaColgante(), 10, 0.021, 6, false), matCuerda,
      );
      const cabeza = new THREE.Mesh(new THREE.SphereGeometry(0.072, 16, 12), matLaton);
      cabeza.position.set(0, -0.158, 0.010);
      cabeza.scale.set(1, 0.86, 1);
      const cuello = new THREE.Mesh(new THREE.SphereGeometry(0.030, 10, 6), matLaton);
      cuello.position.set(0, -0.222, 0.010);
      cuello.scale.set(1, 0.60, 1);
      const falda = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 30, 6, true), matFalda);
      falda.position.set(0, -0.228, 0.010);
      borla.add(colgante, cabeza, cuello, falda);
      raiz.add(cuerda, nudo, borla);
      grupo.add(raiz);
      return { lado, raiz, cuerda, nudo, borla };
    });

    /* Lo que sabe el telón del encuadre: el medio ancho del escenario en el
       plano de la tela. Con él la cintura mide 0.11·W en cualquier caja y el
       cordón abraza justo esa cintura. */
    function encuadrar(medioAncho, medioAlto = MEDIO_ALTO_IPHONE) {
      const m = medioAncho;
      const d = medioAlto / Math.tan(FOV * Math.PI / 360) + Z;
      const cobertura = envolventeTelon(m / medioAlto, d, 1.432, 1.798);
      const coberturaCenefa = envolventeTelon(m / medioAlto, d, 1.848, 1.952);
      const borde = Math.max(BORDE, cobertura.x + 0.09);
      uniformes.encuadre.value = m;
      uniformes.borde.value = borde;
      uniformes.ancho.value = borde + 0.05;
      uniformes.medioAlto.value = Math.max(ALTO / 2, cobertura.y + 0.09);
      uniformes.suelo.value = -medioAlto;
      // La cenefa sigue al techo visible; conserva espesor, festones y Z.
      const techo = Math.max(2.75 + medioAlto - MEDIO_ALTO_IPHONE, coberturaCenefa.y + 0.09);
      const anchoCenefa = Math.max(CENEFA_ANCHO, 2 * borde, 2 * (coberturaCenefa.x + 0.09));
      cenefa.material.uniforms.uAncho.value = anchoCenefa;
      cenefa.material.uniforms.uBorde.value = anchoCenefa / 2;
      cenefa.position.y = techo - CENEFA_ALTO / 2;
      // Festón más bajo (uv.y = 0.10), proyectado al plano de los paños.
      uniformes.cenefa.value = (techo - 0.90 * CENEFA_ALTO) * (d - Z) / (d - 1.9);
      Y_ALZA = -medioAlto + H_ALZA * (uniformes.cenefa.value + medioAlto);
      const dentro = m * (1 - 2 * F_CINTURA);
      const fuera = m + 0.03;
      /* La cuerda abraza la cintura y nada más: si se pasa de ancho deja de
         leerse como cuerda y se convierte en un aro colgado del aire. El
         extremo de dentro cae justo en el filo libre del swag —ahí se ve
         rodear el canto— y el de fuera se hunde detrás de la tela, que sigue
         hasta el borde. */
      const rx = (fuera - dentro) / 2;
      const ry = Math.max(0.07, rx * 0.34);
      const cx = (fuera + dentro) / 2;
      const uNudo = Math.sin(A_NUDO);
      alzapanos.forEach((a) => {
        a.raiz.position.set(a.lado * cx, Y_ALZA, Z_CINTURA);
        const curva = curvaCintura(a.lado, rx, ry, FONDO_CUERDA);
        a.cuerda.geometry.dispose();
        a.cuerda.geometry = new THREE.TubeGeometry(curva, 72, R_CUERDA, 8, true);
        /* Un paso de torzal por cada 2.6 radios de cuerda: el surco mide lo
           mismo que el cabo mida la cintura lo que mida. */
        matCuerda.uniforms.uTorsion.value = Math.max(8, Math.round(curva.largo / (2.6 * R_CUERDA)));
        a.nudo.position.set(
          -a.lado * Math.cos(A_NUDO) * rx,
          -uNudo * ry,
          Math.pow(uNudo, 0.72) * FONDO_CUERDA,
        );
        a.borla.position.set(a.nudo.position.x, a.nudo.position.y - 0.03, a.nudo.position.z + 0.012);
      });
    }
    encuadrar(uniformes.encuadre.value);

    /* La apertura es una transición CSS de verdad, no una persecución
       exponencial: 1.15 s cronometrados con `CURVA_TELON`, la misma
       `cubic-bezier(0.66, 0, 0.2, 1)` que la hoja de estilo de la casa. Si
       llega una orden contraria a medio camino, el tramo arranca desde el
       valor de ahora y vuelve a durar 1.15 s —igual que hace el navegador al
       reemplazar una transición en vuelo—, así que nunca hay salto. */
    // El reloj recorta cuadros lentos a 50 ms a propósito y se pausa al esconder la pestaña.
    const DURACION = 1.15;
    let desde = 0, hasta = 0, t0 = -1;

    return {
      grupo,
      encuadrar,
      abrir(t, v) {
        const meta = v ? 1 : 0;
        if (meta === hasta && (t0 >= 0 || uniformes.recogida.value === meta)) return;
        desde = uniformes.recogida.value;
        hasta = meta;
        t0 = t;
      },
      update(t) {
        if (t0 >= 0) {
          const a = Math.min(1, Math.max(0, (t - t0) / DURACION));
          uniformes.recogida.value = desde + (hasta - desde) * CURVA_TELON(a);
          if (a >= 1) { uniformes.recogida.value = hasta; t0 = -1; }
        }
        /* Los paños no se esconden nunca: abiertos siguen colgando a los
           lados, y por eso el conteo sigue apareciendo por debajo de la tela
           mientras el telón viaja. Lo único que aparece y desaparece es el
           alzapaño, en el último 30 % de la apertura. */
        const r = uniformes.recogida.value;
        const k = Math.min(1, Math.max(0, (r - 0.7) / 0.3));
        const suave = k * k * (3 - 2 * k);
        opacidadAlza.value = suave;
        alzapanos.forEach((a, i) => {
          a.raiz.visible = suave > 0.01;
          a.raiz.scale.setScalar(0.55 + 0.45 * suave);
          /* La borla cuelga a plomo aunque la cuerda vaya ladeada, y se
             balancea sola: ±2.6° con período 2.6 s, desfasada por lado. */
          a.borla.rotation.z = -a.lado * 0.16
            + Math.sin(t * 2.417 + i * 1.7) * 0.046 * suave;
        });
      },
      get abierto() { return uniformes.recogida.value > 0.5; },
    };
  }

  /* ── crearMarquesina ───────────────────────────────────────────────
     Frontera R3F: <Marquesina paso modo /> — bombillas de vidrio con
     filamento y un halo aditivo por bombilla. Sin postproceso. */
  function crearMarquesina(grupo) {
    const bombillas = [];
    const geoVidrio = new THREE.CircleGeometry(4.6, 16);
    const geoFilamento = new THREE.CircleGeometry(2.4, 12);

    function armar(cuantas) {
      bombillas.forEach((b) => grupo.remove(b.raiz));
      bombillas.length = 0;
      for (let i = 0; i < cuantas; i += 1) {
        const raiz = new THREE.Group();
        const vidrio = new THREE.Mesh(geoVidrio, new THREE.MeshBasicMaterial({
          color: new THREE.Color(0.32, 0.26, 0.09), transparent: true, opacity: 0.9,
        }));
        const filamento = new THREE.Mesh(geoFilamento, new THREE.MeshBasicMaterial({
          color: new THREE.Color(0.54, 0.44, 0.11),
        }));
        filamento.position.z = 0.1;
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: TEX_HALO, blending: THREE.AdditiveBlending,
          depthTest: false, depthWrite: false, transparent: true, opacity: 0,
        }));
        halo.scale.setScalar(30);
        halo.position.z = 0.2;
        raiz.add(vidrio, filamento, halo);
        grupo.add(raiz);
        bombillas.push({ raiz, vidrio, filamento, halo, brillo: 0, objetivo: 0 });
      }
    }

    return {
      grupo,
      /* Las bombillas se colocan sobre las mismas coordenadas que ocupan los
         `div.foco` del DOM: la marquesina 3D cae exactamente donde caía. */
      colocar(puntos) {
        if (puntos.length !== bombillas.length) armar(puntos.length);
        puntos.forEach(({ x, y }, i) => bombillas[i].raiz.position.set(x, y, 0));
      },
      setPatron(paso, modo) {
        bombillas.forEach((b, indice) => {
          b.objetivo = modo === 'todo' ? 1
            : modo === 'fiesta' ? (paso % 2 === 0 ? 1 : 0)
            : ((indice + paso) % (modo === 'girando' ? 3 : 4) === 0 ? 1 : 0);
        });
      },
      update(t, dt) {
        const k = Math.min(1, dt * 14);
        bombillas.forEach((b) => {
          b.brillo += (b.objetivo - b.brillo) * k;
          const v = b.brillo;
          b.vidrio.material.color.setRGB(0.32 + 0.68 * v, 0.26 + 0.65 * v, 0.09 + 0.57 * v);
          b.filamento.material.color.setRGB(0.54 + 0.46 * v, 0.44 + 0.52 * v, 0.11 + 0.61 * v);
          b.halo.material.opacity = v * 0.8;
          b.halo.scale.setScalar(22 + 12 * v);
        });
      },
    };
  }

  /* ── crearTambores ─────────────────────────────────────────────────
     Frontera R3F: <Tambores tiras elegido /> — tres cilindros de eje
     horizontal con los pósters envueltos. El módulo no sabe qué es un
     finalista: recibe tiras y ángulos, y los gira. */
  function crearTambores(grupo) {
    const vertice = `
      varying vec2 vUv;
      varying vec3 vN;
      void main() {
        vUv = uv;
        vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`;

    const fragmento = `
      uniform sampler2D uMapa;
      uniform float uCeldas;
      uniform float uElegido;
      uniform float uApagado;
      uniform vec3 uLaton;
      varying vec2 vUv;
      varying vec3 vN;
      void main() {
        vec3 c = texture2D(uMapa, vUv).rgb;
        float u = fract(vUv.x * uCeldas);
        float bu = (1.0 - smoothstep(0.0, 0.010, min(u, 1.0 - u)));
        float bv = (1.0 - smoothstep(0.0, 0.016, min(vUv.y, 1.0 - vUv.y)));
        float marco = max(bu, bv);
        c = mix(c, uLaton, marco * (0.26 + 0.6 * uElegido));
        float cara = clamp(vN.z, 0.0, 1.0);
        c *= mix(0.035, 1.0, pow(cara, 0.8));
        c *= 1.0 + 0.4 * uElegido * pow(cara, 2.0);
        float lum = dot(c, vec3(0.299, 0.587, 0.114));
        c = mix(c, vec3(lum), 0.7 * uApagado);
        c *= mix(1.0, 0.28, uApagado);
        gl_FragColor = vec4(c, 1.0);
      }`;

    const geoTambor = new THREE.CylinderGeometry(RADIO, RADIO, POSTER_ANCHO, 72, 1, true);
    const geoTapa = new THREE.CircleGeometry(RADIO, 48);
    const geoLuz = new THREE.PlaneGeometry(POSTER_ANCHO * 2.1, POSTER_ALTO * 1.5);

    const tambores = [0, 1, 2].map((indice) => {
      const raiz = new THREE.Group();
      raiz.position.set((indice - 1) * SEPARACION, 0, -RADIO);
      raiz.scale.setScalar(ESCALA_TAMBOR);
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uMapa: { value: null },
          uCeldas: { value: CELDAS },
          uElegido: { value: 0 },
          uApagado: { value: 0 },
          uLaton: { value: LATON },
        },
        vertexShader: vertice,
        fragmentShader: fragmento,
      });
      const eje = new THREE.Group();
      eje.rotation.z = Math.PI / 2;
      const cilindro = new THREE.Mesh(geoTambor, material);
      eje.add(cilindro);
      [-1, 1].forEach((lado) => {
        const tapa = new THREE.Mesh(geoTapa, new THREE.MeshBasicMaterial({
          color: new THREE.Color(0.05, 0.03, 0.04), side: THREE.DoubleSide,
        }));
        tapa.rotation.x = Math.PI / 2;
        tapa.position.y = lado * POSTER_ANCHO / 2;
        eje.add(tapa);
      });
      raiz.add(eje);

      /* La luz del proyector que se posa en el tambor: un plano aditivo
         delante, no una luz real —no hay postproceso y no hace falta. */
      const luz = new THREE.Mesh(geoLuz, new THREE.MeshBasicMaterial({
        map: TEX_HALO, blending: THREE.AdditiveBlending,
        transparent: true, depthWrite: false, opacity: 0,
      }));
      luz.position.set(0, 0, RADIO + 0.3);
      raiz.add(luz);

      grupo.add(raiz);
      return {
        raiz, cilindro, material, luz,
        p: 0, desde: 0, hasta: 0, inicio: 0, duracion: 0,
        objetivoLuz: 0, objetivoApagado: 0,
      };
    });

    /* El ángulo que deja la celda `k` de frente: la textura empieza en +Z y
       avanza con theta, así que la vuelta va en contra. */
    const anguloDe = (p) => -((p + 0.5) / CELDAS) * Math.PI * 2;

    grupo.visible = false;

    return {
      grupo,
      montar(tirasPorTambor) {
        grupo.visible = true;
        tambores.forEach((tb, i) => {
          const tira = tirasPorTambor[i];
          tb.raiz.visible = !!tira;
          if (!tira) return;
          tb.material.uniforms.uMapa.value?.dispose();
          tb.material.uniforms.uMapa.value = texturaDe(lienzoTira(tira.celdas), true);
          tb.p = 0;
          tb.destino = tira.destino;
          tb.desde = 0; tb.hasta = 0; tb.duracion = 0;
          tb.material.uniforms.uElegido.value = 0;
          tb.material.uniforms.uApagado.value = 0;
          tb.objetivoLuz = 0; tb.objetivoApagado = 0;
          tb.cilindro.rotation.y = anguloDe(0);
        });
        /* Con dos finalistas o uno, los tambores sobrantes se van y los que
           quedan se centran, como se centran los carretes del CSS. */
        const vivos = tambores.filter((tb) => tb.raiz.visible);
        vivos.forEach((tb, i) => {
          tb.raiz.position.x = (i - (vivos.length - 1) / 2) * SEPARACION;
        });
      },
      girar(t0, base, paroJuntos, corto) {
        tambores.filter((tb) => tb.raiz.visible).forEach((tb, indice) => {
          const vueltas = 4 + indice;
          tb.desde = tb.p;
          tb.hasta = vueltas * CELDAS + tb.destino;
          tb.inicio = t0;
          tb.duracion = (corto ? 30 : base + (paroJuntos ? 0 : indice * base * 0.45)) / 1000;
        });
      },
